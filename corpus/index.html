<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f56e0">
<title>Corpus Coach</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Corpus">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Mise en page : scène 3D du coach à gauche (en haut sur téléphone), panneau de navigation à droite. */
:root {
  --bg: #eef0f3; --surface: #ffffff; --surface-2: #f5f6f8; --ink: #12161d; --muted: #5b6472; --line: #dde1e7;
  --accent: #2f56e0; --accent-soft: #e3e9fd; --accent-ink: #ffffff; --pulse: #f2551f; --ok: #16895c; --warn: #b26a00;
  --stage: #dfe2e6; --hud: rgba(255,255,255,.86); --hud-ink: #12161d; --shadow: 0 1px 2px rgba(18,22,29,.06), 0 6px 24px rgba(18,22,29,.06);
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif; --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px; --r-sm: 9px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1015; --surface: #151920; --surface-2: #1b2029; --ink: #eef1f5; --muted: #9aa3b2; --line: #262c36;
  --accent: #7d96ff; --accent-soft: #1e2645; --accent-ink: #0b0f1a; --pulse: #ff7a4d; --ok: #3cc48a; --warn: #e5a23a;
  --stage: #1a1f27; --hud: rgba(21,25,32,.84); --hud-ink: #eef1f5; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1015; --surface: #151920; --surface-2: #1b2029; --ink: #eef1f5; --muted: #9aa3b2; --line: #262c36;
  --accent: #7d96ff; --accent-soft: #1e2645; --accent-ink: #0b0f1a; --pulse: #ff7a4d; --ok: #3cc48a; --warn: #e5a23a;
  --stage: #1a1f27; --hud: rgba(21,25,32,.84); --hud-ink: #eef1f5; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.3); color-scheme: dark; }

[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-display); font-variant-numeric: tabular-nums; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr); }
.topbar { display: flex; align-items: center; gap: 14px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--surface); }
.brand { display: flex; align-items: baseline; gap: 8px; margin-right: auto; }
.brand b { font-family: var(--f-display); font-stretch: 125%; font-weight: 850; font-size: 22px; letter-spacing: -.01em; }
.brand span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.coach-btn { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px 4px 4px; font-weight: 600; font-size: 13px; }
.coach-btn i { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-style: normal; font-family: var(--f-display); font-weight: 800; }

.layout { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 440px; }
.stage { position: relative; min-height: 0; background: var(--stage); overflow: hidden; }
#gl { position: absolute; inset: 0; }
.panel { min-height: 0; overflow: auto; background: var(--bg); border-left: 1px solid var(--line); display: flex; flex-direction: column; }

/* HUD */
.hud { position: absolute; inset: 0; pointer-events: none; display: grid; grid-template-rows: auto 1fr auto; padding: 14px; gap: 10px; }
.hud > * { pointer-events: auto; }
.hud-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.ex-title { background: var(--hud); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 10px 14px; border-radius: var(--r); box-shadow: var(--shadow); max-width: min(520px, 100%); }
.ex-title .eyebrow { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.ex-title h1 { margin: 2px 0 0; font-family: var(--f-display); font-stretch: 112%; font-weight: 800; font-size: clamp(20px, 2.6vw, 28px); line-height: 1.05; text-wrap: balance; }
.ex-title .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
.views { display: flex; gap: 4px; background: var(--hud); backdrop-filter: blur(10px); padding: 4px; border-radius: 999px; box-shadow: var(--shadow); }
.views button { border: 0; background: transparent; border-radius: 999px; padding: 6px 10px; font-size: 12px; font-weight: 600; color: var(--muted); }
.views button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.hud-mid { display: grid; place-items: center; pointer-events: none; }
.big-overlay { pointer-events: none; text-align: center; }
.big-overlay .n { font-family: var(--f-display); font-stretch: 125%; font-weight: 900; font-size: clamp(90px, 16vw, 180px); line-height: .9; color: var(--ink); text-shadow: 0 2px 30px var(--stage); }
.big-overlay .lbl { font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: 13px; color: var(--muted); }
.big-overlay .next { margin-top: 8px; font-size: 15px; font-weight: 600; }
.hud-bottom { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: end; gap: 12px; }
.counter { position: relative; width: 132px; height: 132px; background: var(--hud); backdrop-filter: blur(10px); border-radius: 50%; box-shadow: var(--shadow); display: grid; place-items: center; }
.counter svg { position: absolute; inset: 6px; width: calc(100% - 12px); height: calc(100% - 12px); transform: rotate(-90deg); }
.counter .track { stroke: var(--line); }
.counter .bar { stroke: var(--accent); transition: stroke-dashoffset .35s ease; }
.counter .c-in { text-align: center; line-height: 1; }
.counter .c-n { font-family: var(--f-display); font-stretch: 118%; font-weight: 900; font-size: 46px; font-variant-numeric: tabular-nums; }
.counter .c-n.pop { animation: pop .35s ease; color: var(--pulse); }
@keyframes pop { 0% { transform: scale(1.25); } 100% { transform: scale(1); } }
.counter .c-of { font-size: 12px; color: var(--muted); margin-top: 4px; font-weight: 600; }
.coach-line { grid-column: 2; justify-self: center; display: flex; gap: 10px; align-items: center; background: var(--hud); backdrop-filter: blur(10px); padding: 10px 14px; border-radius: var(--r); box-shadow: var(--shadow); max-width: 560px; min-width: 0; }
.coach-line i { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-style: normal; font-family: var(--f-display); font-weight: 800; font-size: 13px; }
.coach-line p { margin: 0; font-weight: 500; font-size: 14px; min-width: 0; }
.coach-line .wave { display: inline-flex; gap: 2px; align-items: end; height: 14px; margin-left: 2px; }
.coach-line .wave b { width: 3px; background: var(--accent); border-radius: 2px; height: 4px; }
.speaking .wave b { animation: wave .9s ease-in-out infinite; }
.speaking .wave b:nth-child(2) { animation-delay: .15s; } .speaking .wave b:nth-child(3) { animation-delay: .3s; }
@keyframes wave { 0%,100% { height: 4px; } 50% { height: 14px; } }
.controls { display: flex; gap: 8px; align-items: center; grid-column: 3; justify-self: end; }
.counter { grid-column: 1; }
.ctrl { width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--hud); backdrop-filter: blur(10px); box-shadow: var(--shadow); display: grid; place-items: center; }
.ctrl svg { width: 20px; height: 20px; }
.ctrl.primary { width: 56px; height: 56px; background: var(--ink); color: var(--bg); }
.btn { border: 0; border-radius: 999px; padding: 11px 18px; font-weight: 700; font-size: 14px; background: var(--ink); color: var(--bg); display: inline-flex; align-items: center; gap: 8px; }
.btn.accent { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.sm { padding: 7px 13px; font-size: 13px; }
.btn svg { width: 16px; height: 16px; }
.progress-strip { position: absolute; left: 0; right: 0; top: 0; height: 4px; display: flex; gap: 2px; }
.progress-strip span { flex: 1; background: color-mix(in srgb, var(--ink) 12%, transparent); }
.progress-strip span.done { background: var(--accent); }
.progress-strip span.cur { background: linear-gradient(90deg, var(--accent) var(--p, 0%), color-mix(in srgb, var(--ink) 12%, transparent) var(--p, 0%)); }

/* Panneau */
.tabs { position: sticky; top: 0; z-index: 2; display: flex; gap: 2px; padding: 10px 12px 0; background: var(--bg); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs button { border: 0; background: transparent; padding: 10px 10px 12px; font-weight: 600; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.tabs .badge { display: inline-grid; place-items: center; min-width: 18px; height: 18px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-size: 11px; margin-left: 4px; padding: 0 5px; }
.view { padding: 16px max(16px, env(safe-area-inset-right, 0px)) 28px 16px; display: grid; gap: 14px; align-content: start; }
.view h2 { margin: 4px 0 0; font-family: var(--f-display); font-stretch: 110%; font-weight: 800; font-size: 20px; }
.view h3 { margin: 0; font-size: 15px; font-weight: 700; }
.lead { color: var(--muted); margin: 0; font-size: 14px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 600; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tag { display: inline-flex; align-items: center; border-radius: 6px; padding: 2px 7px; font-size: 11.5px; font-weight: 600; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.tag.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; }
.card .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.card .grow { flex: 1; min-width: 0; }
.prog-title { font-family: var(--f-display); font-stretch: 108%; font-weight: 800; font-size: 18px; margin: 0; }
.prog-meta { display: flex; gap: 12px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
.prog-meta b { color: var(--ink); font-weight: 700; }
.safety { font-size: 13px; background: color-mix(in srgb, var(--warn) 12%, var(--surface)); border-radius: var(--r-sm); padding: 8px 10px; color: var(--ink); }
.ex-list { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; }
.ex-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 10px 10px; border-radius: var(--r-sm); border: 0; background: transparent; text-align: left; width: 100%; }
.ex-row:hover { background: var(--surface-2); }
.ex-row .n { font-weight: 600; }
.ex-row .z { color: var(--muted); font-size: 12.5px; }
.ex-row .sr { font-family: var(--f-display); font-weight: 700; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ex-row.cur { background: var(--accent-soft); }
.ex-row.cur .n { color: var(--accent); }
.ex-row.done .n { color: var(--muted); text-decoration: line-through; }
.search { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 10px 14px; }
.back { border: 0; background: transparent; color: var(--muted); font-weight: 600; padding: 0; display: inline-flex; gap: 6px; align-items: center; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.stat .v { font-family: var(--f-display); font-stretch: 115%; font-weight: 850; font-size: 30px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.stat .k { color: var(--muted); font-size: 12.5px; font-weight: 600; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal span { aspect-ratio: 1; border-radius: 7px; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--surface-2); color: var(--muted); font-variant-numeric: tabular-nums; max-width: 100%; }
.cal span.done { background: var(--accent); color: var(--accent-ink); }
.cal span.today { outline: 2px solid var(--ink); outline-offset: -2px; color: var(--ink); }
.cal span.rest { background: transparent; border: 1px dashed var(--line); }
.cal span.miss { background: color-mix(in srgb, var(--pulse) 14%, var(--surface)); color: var(--pulse); }
.bar-track { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.bar-track b { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.form label { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.form input, .form select { border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); padding: 8px 10px; width: 100%; min-width: 0; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .axis { fill: var(--muted); font-size: 10px; font-family: var(--f-body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; font-weight: 600; padding: 5px 8px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -110%); }
.photos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.photo { position: relative; border-radius: var(--r-sm); overflow: hidden; background: var(--surface-2); aspect-ratio: 3/4; border: 2px solid transparent; padding: 0; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo small { position: absolute; left: 6px; bottom: 6px; background: var(--hud); color: var(--hud-ink); border-radius: 5px; padding: 1px 6px; font-size: 11px; font-weight: 700; }
.photo[aria-pressed="true"] { border-color: var(--accent); }
.compare { position: relative; border-radius: var(--r); overflow: hidden; aspect-ratio: 3/4; max-width: 100%; background: var(--surface-2); }
.compare img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.compare .after { clip-path: inset(0 0 0 var(--cut, 50%)); }
.compare .line { position: absolute; top: 0; bottom: 0; left: var(--cut, 50%); width: 2px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.2); }
.compare .lab { position: absolute; top: 8px; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: rgba(0,0,0,.55); color: #fff; }
.compare input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.sw.duo { background: linear-gradient(135deg, var(--a) 50%, var(--b) 50%); }
.setting { display: grid; gap: 8px; }
.setting > span { font-size: 12.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 600; }
.toggle input { width: 42px; height: 24px; accent-color: var(--accent); }
.badges { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.bdg { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 8px; text-align: center; background: var(--surface); }
.bdg .ico { width: 34px; height: 34px; border-radius: 50%; margin: 0 auto 6px; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); }
.bdg.on .ico { background: var(--accent); color: var(--accent-ink); }
.bdg .t { font-size: 12px; font-weight: 700; } .bdg .d { font-size: 11px; color: var(--muted); }
.bdg:not(.on) { opacity: .6; }
.note { font-size: 12.5px; color: var(--muted); }
.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 16px; text-align: center; color: var(--muted); font-size: 14px; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; box-shadow: var(--shadow); z-index: 20; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-weight: 600; }

@media (max-width: 980px) {
  .app { height: auto; min-height: 100%; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  .panel, .stage { min-width: 0; }
  .stage { height: 62svh; min-height: 420px; position: sticky; top: 0; z-index: 3; }
  .panel { border-left: 0; overflow: visible; }
  .tabs { top: 0; }
  .counter { width: 96px; height: 96px; }
  .counter .c-n { font-size: 34px; }
  .hud { padding: 10px; }
  .hud-bottom { grid-template-columns: auto 1fr; }
  .coach-line { grid-column: 1 / -1; grid-row: 1; justify-self: stretch; padding: 8px 10px; }
  .coach-line p { font-size: 13px; }
  .coach-line i { width: 26px; height: 26px; }
  .controls { justify-self: end; grid-column: 2; grid-row: 2; }
  .counter { grid-row: 2; }
  .brand span { display: none; }
  .ex-title { padding: 8px 12px; }
}
@media (max-width: 520px) {
  .topbar { gap: 8px; }
  .seg button { padding: 6px 10px; }
  .coach-btn span { display: none; }
  .coach-btn { padding: 4px; }
  .views button { padding: 5px 8px; }
  .stage { height: 58svh; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><b>Corpus</b><span>coach 3D</span></div>
    <div class="seg" role="group" aria-label="Lieu d'entraînement">
      <button id="place-maison" aria-pressed="true">Maison</button>
      <button id="place-salle" aria-pressed="false">Salle</button>
    </div>
    <button class="coach-btn" id="coach-btn"><i id="coach-initial">L</i><span id="coach-name">Coach Léa</span></button>
  </header>
  <main class="layout">
    <section class="stage" id="stage" aria-label="Coach 3D">
      <div id="gl"></div>
      <div class="loading" id="loading">Chargement du coach…</div>
      <div class="progress-strip" id="strip" hidden></div>
      <div class="hud">
        <div class="hud-top">
          <div class="ex-title">
            <div class="eyebrow" id="hud-eyebrow">Aperçu</div>
            <h1 id="hud-name">Squat</h1>
            <div class="meta" id="hud-meta">3 × 15 · Poids du corps</div>
          </div>
          <div class="views" role="group" aria-label="Angle de vue">
            <button data-view="face" aria-pressed="false">Face</button>
            <button data-view="tq" aria-pressed="false">¾</button>
            <button data-view="side" aria-pressed="false">Profil</button>
            <button data-view="back" aria-pressed="false">Dos</button>
          </div>
        </div>
        <div class="hud-mid"><div class="big-overlay" id="overlay" hidden></div></div>
