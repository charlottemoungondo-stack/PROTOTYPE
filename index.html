  <button class="checkline" role="checkbox" aria-checked="${S.rulesAccepted}" data-a="toggle" data-k="rulesAccepted"><span class="box-ck">${S.rulesAccepted?ic('check',16):''}</span><span>Je m’engage à respecter ces règles. Je sais que je peux signaler ou bloquer quelqu’un à tout moment.</span></button>
  </div>${bottom(`<button class="btn primary" data-a="finish" ${S.rulesAccepted?'':'disabled'}>Découvrir les profils</button>`)}</div>`;

/* ---------------- Application : onglets ---------------- */
function deckList(){const f=S.filters;return PEOPLE.filter(p=>!S.seen.includes(p.id)&&!S.blocked.includes(p.id)&&!S.matches.includes(p.id)&&p.age>=f.ageMin&&p.age<=f.ageMax&&p.dist<=f.dist&&(f.intention==='Toutes'||p.intention===f.intention)&&(!f.interest||p.interests.includes(f.interest)))}
function lockedView(what){return `<div class="locked"><div class="ill warn">${ic('lock',36)}</div><h2 class="h2">Terminez vos vérifications pour ${what}</h2><p class="lead">Pour la sécurité de tout le monde, seuls les membres vérifiés peuvent découvrir des profils, aimer et écrire. En attendant, votre profil reste invisible.</p>${verifCards()}${nextVerifBtn().replace('btn primary','btn primary')}<button class="btn link" data-a="tab" data-t="profil">Compléter mon profil en attendant</button></div>`}
function cardHTML(p,top){const idx=top?(S.photoIdx[p.id]||0):0;const ph=photosOf(p);return `<article class="card ${top?'top':'behind'}" data-id="${p.id}" aria-label="${esc(p.prenom)}, ${p.age} ans" ${top?'':'aria-hidden="true"'}>
  <div class="photo">${photoHTML(ph[idx],top?`Photo ${idx+1} sur ${ph.length} de ${p.prenom}`:'')}</div>
  ${top?`<div class="bars" aria-hidden="true">${ph.map((_,i)=>`<span class="${i===idx?'on':''}"></span>`).join('')}</div><button class="tap l" data-a="photoNav" data-d="-1" data-id="${p.id}" aria-label="Photo précédente"></button><button class="tap r" data-a="photoNav" data-d="1" data-id="${p.id}" aria-label="Photo suivante"></button>
  <button class="vb-float" data-a="sheet" data-k="badge">${ic('shieldcheck',16)} Profil vérifié</button><button class="card-more" data-a="sheet" data-k="cardMenu" data-id="${p.id}" aria-label="Plus d’options pour ${esc(p.prenom)} : signaler, bloquer">${ic('more')}</button>`:''}
  <div class="shade"></div>
  <div class="meta"><div class="name">${esc(p.prenom)}, ${p.age}${p.pronoms?` <span class="pron">${esc(p.pronoms)}</span>`:''}</div>
   <div class="sub">${ic('pin',16)} ${esc(p.ville)} · à environ ${p.dist} km</div>
   <div class="intent">${ic('heart',15)} ${esc(p.intention)}</div>
   <div class="tags">${p.interests.map(i=>`<span>${esc(i)}</span>`).join('')}</div>
   ${top?`<button class="see" data-a="openProfile" data-id="${p.id}" data-ctx="deck">Voir le profil ${ic('chev',16)}</button>`:''}</div>
  ${top?'<div class="stamp like" aria-hidden="true">J’aime</div><div class="stamp pass" aria-hidden="true">Passer</div>':''}</article>`}
function discover(){
 if(!isVerified())return lockedView('découvrir des profils');
 if(S.settings.paused)return `<div class="locked"><div class="ill">${ic('pause',36)}</div><h2 class="h2">Votre profil est en pause</h2><p class="lead">Personne ne vous voit dans Découvrir. Vos conversations restent ouvertes.</p><button class="btn primary" data-a="toggle" data-k="settings.paused">Réactiver mon profil</button></div>`;
 const d=deckList();
 if(!d.length)return `<div class="locked"><div class="ill rose">${ic('spark',36)}</div><h2 class="h2">Vous avez vu tous les profils pour le moment</h2><p class="lead">Nous ne montrons que des personnes vérifiées qui correspondent à vos filtres. De nouveaux membres terminent leur inscription chaque jour : revenez demain.</p><button class="btn primary" data-a="sheet" data-k="filters">Élargir mes filtres</button>${S.seen.some(id=>!S.matches.includes(id))?`<button class="btn ghost" data-a="replay">Revoir les profils passés</button>`:''}</div>`;
 const left=Math.max(0,S.quota.likes-S.likesUsed);
 return `<div class="deckwrap"><div class="deck">${d[1]?cardHTML(d[1],false):''}${cardHTML(d[0],true)}</div>
  <div class="actions"><button class="act small" data-a="undo"><span class="circle">${ic('undo',20)}</span>Revenir</button>
  <button class="act pass" data-a="decide" data-v="pass"><span class="circle">${ic('x',30)}</span>Passer</button>
  <button class="act like ${likesLocked()?'locked':''}" data-a="decide" data-v="like" ${likesLocked()?'aria-label="J’aime : quota gratuit atteint, voir l’abonnement Premium"':''}><span class="circle">${ic(likesLocked()?'lock':'heart',32,!likesLocked())}</span>J’aime</button>
  <button class="act small" data-a="openProfile" data-id="${d[0].id}" data-ctx="deck"><span class="circle">${ic('info',20)}</span>Profil</button></div>
  <p class="quota">${S.premium?'Premium : J’aime illimités':left?`${left} J’aime gratuit${left>1?'s':''} restant${left>1?'s':''}`:'J’aime gratuits épuisés · <button class="inline-link" data-a="paywall" data-r="likes">Prendre l’abonnement Premium</button>'}</p></div>`}
function likers(){return PEOPLE.filter(p=>p.likesYou&&!S.seen.includes(p.id)&&!S.blocked.includes(p.id)&&!S.matches.includes(p.id))}
function likesTab(){
 if(!isVerified())return lockedView('voir vos likes');
 const L=likers();
 if(!L.length)return `<div class="locked"><div class="ill rose">${ic('heart',36)}</div><h2 class="h2">Pas de nouveau J’aime pour l’instant</h2><p class="lead">Un profil avec 3 photos ou plus et une présentation reçoit en général davantage d’attention.</p><button class="btn ghost" data-a="go" data-s="edit">Améliorer mon profil</button></div>`;
 return `<div class="scroll" data-sk="likes"><div><h2 class="h2">${L.length} personne${L.length>1?'s':''} vous ${L.length>1?'ont':'a'} aimé</h2><p class="lead" style="margin-top:6px">${S.premium?'Touchez un profil pour le découvrir.':'Continuez à découvrir : si vous aimez l’une de ces personnes, ce sera réciproque immédiatement.'}</p></div>
 <div class="grid2">${L.map(p=>S.premium?`<button class="lcard" data-a="openProfile" data-id="${p.id}" data-ctx="likes"><div class="photo">${photoHTML(photosOf(p)[0],'')}</div><div class="shade"></div><span class="cap">${esc(p.prenom)}, ${p.age}</span></button>`:`<div class="lcard blur" aria-hidden="true"><div class="photo">${photoHTML(photosOf(p)[0],'')}</div></div>`).join('')}</div>
 ${S.premium?'':`<div class="upsell"><b>Voir qui vous a aimé</b><p>Avec l’abonnement Premium, ces profils s’affichent en clair. Sans abonnement, vous les croiserez normalement dans Découvrir.</p><button class="btn peach" data-a="paywall" data-r="likes">Découvrir l’abonnement Premium</button></div>`}</div>`}
function lastMsg(id){const c=S.convos[id]||[];return c[c.length-1]}
function messagesTab(){
 if(!isVerified())return lockedView('écrire à vos matchs');
 const ms=S.matches.filter(id=>!S.blocked.includes(id));
 const fresh=ms.filter(id=>!(S.convos[id]||[]).length);
 const conv=ms.filter(id=>(S.convos[id]||[]).length);
 if(!ms.length)return `<div class="locked"><div class="ill rose">${ic('chat',36)}</div><h2 class="h2">Pas encore de conversation</h2><p class="lead">Quand une personne que vous aimez vous aime aussi, vous pourrez vous écrire ici.</p><button class="btn primary" data-a="tab" data-t="decouvrir">Découvrir des profils</button></div>`;
 return `<div class="scroll" data-sk="msgs"><button class="btn soft" data-a="jNew">${ic('plus',20)} Nouvelle conversation de test</button>
 ${fresh.length?`<div><h2 class="sec-t" style="margin:0 0 8px">Nouveaux matchs</h2><div class="newmatches">${fresh.map(id=>`<button class="nm" data-a="openChat" data-id="${id}">${avatar(P(id),64)}${esc(P(id).prenom)}</button>`).join('')}</div></div>`:''}
 <div><h2 class="sec-t" style="margin:0 0 8px">Conversations</h2><div class="list">${conv.map(id=>{const p=P(id),m=lastMsg(id),flag=flagReasons(m).length&&!S.ignored[id];return `<button class="row conv" data-a="openChat" data-id="${id}">${avatar(p,52)}<span class="grow"><b>${esc(p.prenom)} ${vicon(15)}</b><span class="prev ${S.unread[id]?'unread':''}">${m.f==='me'?'Vous : ':''}${m.f==='sys'?'':''}${esc(m.t)}</span>${S.closed[id]?`<span class="flag">${ic('info',13)} Conversation close</span>`:flag?`<span class="flag">${ic('warn',13)} Message à vérifier</span>`:''}</span><span class="meta2"><span>${esc(m.h)}</span>${S.unread[id]?'<span class="udot"></span><span class="vh">non lu</span>':''}</span></button>`}).join('')||'<p class="hint" style="padding:14px 16px">Écrivez à vos nouveaux matchs pour démarrer une conversation.</p>'}</div></div></div>`}
function completion(){let n=0;const m=S.me;if(m.photos.length>=2)n+=30;if(m.photos.length>=3)n+=10;if(m.bio.length>20)n+=20;if(m.intention)n+=15;if(m.interests.length>=3)n+=15;if(m.prenom)n+=10;return Math.min(100,n)}
function profilTab(){const m=S.me,c=completion();const row=(a,icn,t,s,extra='')=>`<button class="row" ${a}><span class="ric">${ic(icn,20)}</span><span class="grow"><b>${t}</b>${s?`<small>${s}</small>`:''}</span>${extra}${ic('chev',18).replace('class="ic"','class="ic chev"')}</button>`;
 return `<div class="scroll" data-sk="me">
 <div class="mehead">${m.photos.length?avatar('me',84):`<span class="av" style="width:84px;height:84px;display:grid;place-items:center">${ic('user',36)}</span>`}<div class="grow"><span class="nm2">${esc(m.prenom||'Votre profil')}${m.age?', '+m.age:''}</span>${isVerified()?`<span class="vbadge">${ic('shieldcheck',15)} Profil vérifié</span>`:`<span class="status wait">${ic('clock',14)} Vérifications à terminer</span>`}</div></div>
 <div class="two"><button class="btn soft" data-a="preview">${ic('eye',18)} Voir mon profil</button><button class="btn soft" data-a="go" data-s="edit">${ic('edit',18)} Modifier</button></div>
 ${isVerified()?'':`<div class="note warn">${ic('lock')}<div><b>Votre profil est invisible</b><p>Terminez vos deux vérifications pour apparaître dans Découvrir et pouvoir écrire.</p><button class="btn primary sm" style="margin-top:10px" data-a="go" data-s="verify-intro">Reprendre</button></div></div>`}
 <div class="box compl"><div class="range-row"><span>Profil complété</span><span>${c} %</span></div><div class="prog-bar"><span style="width:${c}%"></span></div>${c<100?`<p class="hint">${m.photos.length<3?'Ajoutez une 3e photo pour vous faire mieux connaître.':m.bio.length<=20?'Ajoutez quelques lignes de présentation.':'Ajoutez vos centres d’intérêt.'}</p>`:''}</div>
 <h2 class="sec-t">Compte et sécurité</h2>
 <div class="list">${row('data-a="go" data-s="verifcenter"','shieldcheck','Centre de vérification',isVerified()?'Identité et vidéo vérifiées':'Statut de vos deux contrôles')}${row('data-a="goSafety"','shield','Aide et sécurité','Urgences, conseils, signalements, blocages')}${row('data-a="set" data-k="sub"','card','Abonnement Premium',S.premium?'Abonnement actif (simulation)':'Gratuit · voir les avantages')}</div>
 <h2 class="sec-t">Réglages</h2>
 <div class="list">${row('data-a="set" data-k="disc"','sliders','Préférences de découverte','Distance, âges, pause du profil')}${row('data-a="set" data-k="privacy"','eye','Confidentialité','Distance affichée, statut en ligne, accusés de lecture')}${row('data-a="set" data-k="notifs"','bell','Notifications','Par catégorie, plage silencieuse')}${row('data-a="set" data-k="a11y"','a11y','Accessibilité','Taille du texte, contraste, animations')}${row('data-a="go" data-s="account"','doc','Mon compte et mes données','Télécharger, mettre en pause, supprimer')}</div>
 <button class="btn ghost" data-a="logout">${ic('logout',18)} Se déconnecter</button></div>`}
function tabbar(){const unread=Object.keys(S.unread).filter(k=>S.unread[k]&&S.matches.includes(k)).length;const nl=isVerified()?likers().length:0;const t=(k,l,i,badge)=>`<button data-a="tab" data-t="${k}" ${S.tab===k?'aria-current="page"':''}>${ic(i,24)}${l}${badge?`<span class="dot" aria-label="${badge} nouveau${badge>1?'x':''}">${badge}</span>`:''}</button>`;
 return `<nav class="tabbar" aria-label="Navigation principale">${t('decouvrir','Découvrir','heart')}${t('likes','Likes','star',nl)}${t('messages','Messages','chat',unread)}${t('profil','Profil','user')}</nav>`}
SCR.tabs=()=>{const t=S.tab;let head='',body='';
 if(t==='decouvrir'){head=`<h1 class="vh">Découvrir des profils</h1><header class="apphead"><button class="hbtn" data-a="sheet" data-k="filters">${ic('sliders',18)}<span>Filtres</span></button><div class="wm">${LOGO(26)}<span>liane</span></div><button class="hbtn" data-a="goSafety">${ic('shield',18)}<span>Sécurité</span></button></header>`;body=discover()}
 else if(t==='likes'){head=`<header class="apphead"><h1 class="ah-title">Likes</h1></header>`;body=likesTab()}
 else if(t==='messages'){head=`<header class="apphead"><h1 class="ah-title">Messages</h1><button class="hbtn" data-a="goSafety">${ic('shield',18)}<span>Sécurité</span></button></header>`;body=messagesTab()}
 else{head=`<header class="apphead"><h1 class="ah-title">Profil</h1></header>`;body=profilTab()}
 return `<div class="screen tabs">${head}<div class="tabbody">${body}</div>${tabbar()}</div>`};

/* ---------------- Profil détaillé ---------------- */
SCR.profile=()=>{const v=S.view;const self=v.id==='me';const p=self?{prenom:S.me.prenom||'Vous',age:S.me.age||'',ville:S.me.ville||'Lyon',dist:0,intention:S.me.intention||'—',interests:S.me.interests,bio:S.me.bio,photos:S.me.photos.length?S.me.photos:[{look:DEMO_LOOK,scene:0}],pronoms:S.me.pronoms,vdate:S.verif.idDate}:P(v.id);const ph=p.photos;const idx=Math.min(S.photoIdx['pv'+v.id]||0,ph.length-1);const common=self?[]:p.interests.filter(i=>S.me.interests.includes(i));
 return `<div class="screen">${self?`<div class="preview-banner">${ic('eye',18)} Aperçu : voici ce que les autres voient</div>`:''}<div class="scroll" data-sk="pv-${v.id}" style="padding-top:0">
 <div class="pv-photo"><div class="photo">${photoHTML(ph[idx],`Photo ${idx+1} sur ${ph.length} de ${p.prenom}`)}</div><div class="bars" aria-hidden="true">${ph.map((_,i)=>`<span class="${i===idx?'on':''}"></span>`).join('')}</div>
  <button class="tap l" style="bottom:0" data-a="pvNav" data-d="-1" aria-label="Photo précédente"></button><button class="tap r" style="bottom:0" data-a="pvNav" data-d="1" aria-label="Photo suivante"></button>
  <button class="ovb l" data-a="back" aria-label="Retour">${ic('back')}</button>${self?'':`<button class="ovb r" data-a="sheet" data-k="cardMenu" data-id="${v.id}" data-from="profile" aria-label="Plus d’options : signaler, bloquer">${ic('more')}</button>`}</div>
 <div class="pv-body">
  <div><div class="pv-name"><h1 class="h1">${esc(p.prenom)}${p.age?', '+p.age:''}</h1>${isVerified()||!self?vicon(24):''}${p.pronoms?`<span class="chip">${esc(p.pronoms)}</span>`:''}</div></div>
  <div class="pv-sub">${ic('pin',16)} ${esc(p.ville)}${self?'':` · à environ ${p.dist} km`}</div>
  <div class="box"><span class="lbl">Je recherche</span><span class="big">${ic('heart',20)} ${esc(p.intention)}</span></div>
  ${p.bio?`<div class="box"><span class="lbl">À propos</span><p>${esc(p.bio)}</p></div>`:''}
  ${p.prompt?`<div class="box"><span class="lbl">${esc(p.prompt[0])}</span><p style="font-family:var(--font-display);font-size:1.15em;font-weight:600">${esc(p.prompt[1])}</p></div>`:''}
  ${p.interests.length?`<div class="box"><span class="lbl">Centres d’intérêt${common.length?` · ${common.length} en commun`:''}</span><div class="chips">${p.interests.map(i=>`<span class="chip ${common.includes(i)?'common':''}">${common.includes(i)?ic('check',14):''}${esc(i)}</span>`).join('')}</div></div>`:''}
  <div class="box"><span class="lbl">Vérifications</span><div class="vline">${ic('shieldcheck',20)} Identité vérifiée${p.vdate?` <span class="hint">· ${esc(p.vdate)}</span>`:''}</div><div class="vline">${ic('video',20)} Vidéo de présence vérifiée</div><button class="btn link" style="justify-content:flex-start;padding:0" data-a="sheet" data-k="badge">Ce que cela garantit, et ce que cela ne garantit pas</button></div>
  ${self?'':`<div class="safe-actions"><button class="btn soft" data-a="report" data-id="${v.id}">${ic('flag',18)} Signaler</button><button class="btn soft" data-a="sheet" data-k="block" data-id="${v.id}">${ic('ban',18)} Bloquer</button></div>`}
 </div></div>
 ${(v.ctx==='deck'||v.ctx==='likes')&&!self?`<div class="pv-actions"><button class="act pass" data-a="pvDecide" data-v="pass"><span class="circle">${ic('x',28)}</span>Passer</button><button class="act like" data-a="pvDecide" data-v="like"><span class="circle">${ic('heart',30,true)}</span>J’aime</button></div>`:''}</div>`};

/* ---------------- Conversation ---------------- */
function swapCard(m,i,p){const n=esc(m.net),pn=esc(p.prenom);
 if(m.state==='declined')return `<div class="sys">Vous avez refusé l’échange ${n} proposé par ${pn}. Aucun pseudo n’a été partagé : le sien reste masqué.</div>`;
 if(m.state==='refused')return `<div class="swapc me refused" role="group" aria-label="Échange ${n} refusé"><div class="sw-h">${ic('ban',18)} ${pn} a refusé l’échange ${n}</div><p class="sw-f">Votre pseudo n’a pas été partagé. Vous ne pouvez pas renvoyer de demande à ${pn} : vous pouvez continuer à discuter ici.</p></div>`;
 if(m.state==='withdrawn')return `<div class="sys">Vous avez annulé votre proposition d’échange ${n}.</div>`;
 if(m.state==='done'){const url=NETS[m.net]?NETS[m.net](encodeURIComponent(m.theirs)):'#';return `<div class="swapc done" role="group" aria-label="${n} échangés avec ${pn}"><div class="sw-h">${ic('share',18)} ${n} échangés</div>
  <div class="sw-row">${avatar(p,36)}<span class="grow"><b>${pn}</b><small>@${esc(m.theirs)}</small></span><button class="sw-b" data-a="copyHandle" data-v="${esc(m.theirs)}" aria-label="Copier le pseudo de ${pn}">Copier</button><a class="sw-b primary" href="${url}" target="_blank" rel="noopener noreferrer" aria-label="Ouvrir le profil ${n} de ${pn}">Ouvrir ${ic('chev',14)}</a></div>
  <div class="sw-row">${avatar('me',36)}<span class="grow"><b>Vous</b><small>@${esc(m.mine)}</small></span></div>
  <p class="sw-f">Échangé à ${esc(m.h)}. Hors de Liane, nos protections ne s’appliquent plus, mais vous pouvez toujours signaler ${pn} ici.</p></div>`}
 if(m.f==='them')return `<div class="swapc them" role="group" aria-label="Proposition d’échange ${n}"><div class="sw-h">${ic('share',18)} ${pn} propose d’échanger vos ${n}</div><p class="sw-f">Son pseudo s’affiche dès que vous partagez le vôtre. Rien ne vous oblige à accepter.</p><div class="sw-acts"><button class="sw-b primary" data-a="swapOpen" data-i="${i}">Partager mon ${n}</button><button class="sw-b" data-a="swapDecline" data-i="${i}">Refuser</button></div></div>`;
 return `<div class="swapc me" role="group" aria-label="Votre proposition d’échange ${n}"><div class="sw-h">${ic('share',18)} Vous proposez d’échanger vos ${n}</div><p class="sw-f">En attente de ${pn}. Votre pseudo reste masqué jusqu’à sa réponse.</p><div class="sw-acts"><button class="sw-b" data-a="swapWithdraw" data-i="${i}">Annuler la proposition</button></div></div>`}
function linkify(t){return esc(t).replace(/((https?:\/\/)?(www\.)?(bit\.ly|[a-z0-9-]+\.(com|net|org|ly|io|xyz|fr))(\/[^\s<]*)?)/gi,m=>`<button class="msg-link" data-a="openLink" data-url="${m}">${m}</button>`)}
SCR.chat=()=>{const id=S.chatId,p=P(id),c=S.convos[id]||[];const closed=S.closed[id];const left=Math.max(0,S.quota.msgs-S.msgsUsed);
 const items=c.map((m,i)=>{if(m.f==='sys')return `<div class="sys">${esc(m.t)}</div>`;if(m.kind==='swap')return swapCard(m,i,p);const r=flagReasons(m);const flagged=r.length&&!S.ignored[id+':'+i];
  return `<div class="b ${m.f} ${flagged?'risky':''}">${linkify(m.t)}<div class="t">${esc(m.h)}${m.f==='me'?(S.settings.readReceipts&&c.slice(i+1).some(x=>x.f==='them')?' · Lu':' · Envoyé'):''}</div></div>${flagged?`<div class="riskcard" role="note"><div class="rt">${ic('warn',20)}<span>Prudence : ce message ${r.map(x=>RISKTXT[x]).join(' et ')}.</span></div><p>Les demandes d’argent, de code ou de passage sur une autre messagerie sont des signes fréquents d’arnaque, y compris de la part d’un profil vérifié. Ne payez jamais quelqu’un que vous n’avez pas rencontré.</p><div class="ra"><button class="go" data-a="report" data-id="${id}" data-reason="Arnaque, demande d’argent ou phishing">${ic('flag',15)} Signaler</button><button data-a="sheet" data-k="block" data-id="${id}">Bloquer</button><button data-a="ignoreRisk" data-i="${i}">Ce n’est pas un problème</button></div></div>`:''}`}).join('');
 return `<div class="screen">
 <h1 class="vh">Conversation avec ${esc(p.prenom)}</h1><div class="chathead"><button class="icon-btn" data-a="back" aria-label="Retour">${ic('back')}</button><button class="who" data-a="openProfile" data-id="${id}" data-ctx="chat">${avatar(p,42)}<span><b>${esc(p.prenom)} ${vicon(16)}</b><small>Voir le profil</small></span></button><button class="icon-btn" data-a="sheet" data-k="chatMenu" data-id="${id}" aria-label="Options de la conversation">${ic('more')}</button></div>
 <div class="safestrip">${ic('shield',16)}<span class="grow">Un comportement inapproprié ?</span><button data-a="report" data-id="${id}">${ic('flag',14)} Signaler</button><button data-a="sheet" data-k="block" data-id="${id}">${ic('ban',14)} Bloquer</button></div>
 <div class="msgs" data-sk="chat-${id}" aria-live="polite">
  <div class="sys">Vous vous êtes plu mutuellement. Conseil : restez sur Liane tant que vous ne connaissez pas bien la personne, et ne partagez jamais d’argent ni de code reçu par SMS.</div>
  ${items}${S.typing===id?`<div class="typing">${esc(p.prenom)} écrit…</div>`:''}</div>
 ${closed?`<div class="closed">${esc(closed)}</div>`:`${!S.premium&&left<=2&&left>0?`<div class="qline">${left?`Encore ${left} message${left>1?'s':''} gratuit${left>1?'s':''}`:'Messages gratuits épuisés'}</div>`:''}${msgsLocked()?`<div class="quota-lock" role="status"><div class="ql-h">${ic('lock',18)} Vos ${S.quota.msgs} messages gratuits sont utilisés</div><p>Pour continuer cette conversation, prenez l’abonnement Premium. Signaler et bloquer restent toujours possibles.</p><button class="btn primary" data-a="paywall" data-r="msgs">Prendre l’abonnement Premium</button></div>`:`${S.settings.allowSwap?`<div class="swapbar">${S.swapRefused[id]?`<button class="swap-btn" disabled>${ic('ban',18)} Échange refusé</button><span class="hint">${esc(p.prenom)} a refusé l’échange de réseaux</span>`:`<button class="swap-btn" data-a="swapOpen">${ic('share',18)} Échanger nos réseaux</button><span class="hint">Snapchat, Instagram… seulement si vous acceptez tous les deux</span>`}</div>`:''}<div class="composer"><button class="icon-btn" data-a="toast" data-m="L’envoi de photos arrivera après le MVP, avec une analyse automatique." aria-label="Joindre une photo">${ic('plus')}</button><label for="f-msg" class="vh">Votre message</label><input class="input" id="f-msg" placeholder="Écrire un message…" autocomplete="off" value="${esc(S.tmp.msg||'')}" data-bind="tmp.msg"><button class="send" data-a="send" aria-label="Envoyer">${ic('send',20)}</button></div>`}`}</div>`};

SCR.settings=()=>{const k=S.setKey;const T={disc:'Préférences de découverte',privacy:'Confidentialité',notifs:'Notifications',a11y:'Accessibilité',sub:'Abonnement Premium'};let b='';
 if(k==='disc'){const f=S.filters;b=`<div class="box"><div class="range-row"><label for="r-dist">Distance maximale</label><span id="o-dist">${f.dist} km</span></div><input type="range" id="r-dist" min="1" max="100" value="${f.dist}" data-bind="filters.dist" data-out="o-dist" data-fmt="km"></div>
  <div class="box"><span class="lbl">Tranche d’âge</span><div class="two"><div class="field"><label for="n-amin">De</label><input class="input" type="number" id="n-amin" min="18" max="99" value="${f.ageMin}" data-bind="filters.ageMin"></div><div class="field"><label for="n-amax">À</label><input class="input" type="number" id="n-amax" min="18" max="99" value="${f.ageMax}" data-bind="filters.ageMax"></div></div><p class="hint">Les personnes de moins de 18 ans ne peuvent pas s’inscrire.</p></div>

  <h2 class="sec-t">Autorisations de l’appareil</h2><div class="list"><div class="row"><span class="ric">${ic('pin',20)}</span><span class="grow"><b>Localisation</b><small>Pendant l’utilisation de l’application uniquement</small></span></div><div class="row"><span class="ric">${ic('camera',20)}</span><span class="grow"><b>Appareil photo</b><small>Pour les vérifications et vos photos de profil</small></span></div></div>`;
 if(k==='notifs')b=`<div class="list">${sw('settings.notif.match','Nouveaux matchs','')}${sw('settings.notif.msg','Nouveaux messages','')}${sw('settings.notif.likes','J’aime reçus','')}${sw('settings.notif.tips','Conseils et nouveautés','')}${sw('x','Alertes de sécurité','Toujours activées : connexion inhabituelle, résultat d’un signalement.',{force:true,disabled:true})}</div>
  <div class="list">${sw('settings.quiet','Plage silencieuse de 22 h à 8 h','Aucune notification sonore pendant la nuit.')}${sw('settings.lockPreview','Aperçu des messages sur l’écran verrouillé','Désactivé par défaut pour protéger votre vie privée.')}</div>`;
 if(k==='a11y'){const sc=S.settings.textScale;b=`<div class="box"><span class="lbl" id="lb-size">Taille du texte</span><div class="seg seg3" role="group" aria-labelledby="lb-size">${[[1,'Standard'],[1.15,'Grande'],[1.3,'Très grande']].map(([v,l])=>`<button aria-pressed="${sc===v}" data-a="scale" data-v="${v}">${l}</button>`).join('')}</div><p class="hint">Aperçu : les boutons et les textes s’agrandissent dans toute l’application.</p></div>
  <div class="list">${sw('settings.contrast','Contraste renforcé','Textes secondaires plus foncés, bordures plus visibles.')}${sw('settings.reduceMotion','Réduire les animations','')}${sw('settings.noSwipe','Utiliser seulement les boutons','Désactive le glissement des cartes dans Découvrir.')}</div>
  <div class="note">${ic('info')}<div><b>Lecteur d’écran</b><p>Chaque bouton est nommé, et les alertes de sécurité sont annoncées automatiquement.</p></div></div>`}
 if(k==='sub')b=`${S.premium?`<div class="note trust">${ic('checkc')}<div><b>Votre abonnement Premium est actif</b><p>Simulation : aucun paiement réel. Renouvellement automatique, résiliable à tout moment.</p></div></div>`:''}
  <table class="cmp"><thead><tr><th scope="col">Fonction</th><th scope="col">Gratuit</th><th scope="col">Premium</th></tr></thead><tbody>
  ${[['Vérifications identité et vidéo',1,1],['Signaler, bloquer, centre de sécurité',1,1],['Matcher et discuter',1,1],[`J’aime gratuits`,S.quota.likes,'Illimités'],['Messages gratuits',S.quota.msgs,'Illimités'],['Voir qui vous a aimé',0,1],['Revenir sur un profil passé',0,1],['Filtres supplémentaires',0,1]].map(r=>`<tr><td>${r[0]}</td>${[r[1],r[2]].map(x=>`<td>${x===1?`<span style="color:var(--trust)">${ic('check',18)}</span><span class="vh">Oui</span>`:x===0?`<span aria-hidden="true">—</span><span class="vh">Non</span>`:`<b>${x}</b>`}</td>`).join('')}</tr>`).join('')}</tbody></table>
  <p class="hint">La sécurité n’est jamais payante : vérifications, signalement, blocage et aide restent gratuits pour tout le monde.</p>
  ${S.premium?`<button class="btn ghost" data-a="cancelSub">Résilier l’abonnement</button>`:`<button class="btn primary" data-a="paywall" data-r="sub">Voir les offres</button>`}<button class="btn link" data-a="toast" data-m="Aucun achat à restaurer sur ce compte.">Restaurer un achat</button>`;
 return `<div class="screen">${topbar({title:T[k]})}<div class="scroll" data-sk="set-${k}">${b}</div></div>`};
SCR.safety=()=>`<div class="screen">${topbar({title:'Aide et sécurité'})}<div class="scroll" data-sk="safety">
 <div class="urgent" role="note"><b>${ic('warn',18)} En danger immédiat ?</b><p>Appelez la police au <span class="num">17</span> ou les urgences au <span class="num">112</span>. Victime ou témoin de violences : <span class="num">3919</span>, gratuit et anonyme.</p><p class="hint">Liane n’est pas un service d’urgence. Notre équipe traite les signalements par ordre de gravité.</p></div>
 <details class="acc" open><summary>Avant un premier rendez-vous ${ic('chev',18)}</summary><ul class="tips"><li>Retrouvez-vous dans un lieu public et fréquenté.</li><li>Prévenez un proche : où, quand, avec qui.</li><li>Gardez votre propre moyen de transport pour rentrer.</li><li>Vous pouvez partir à tout moment, sans vous justifier.</li></ul></details>
 <details class="acc"><summary>Reconnaître une arnaque ${ic('chev',18)}</summary><ul class="tips"><li>Une demande d’argent, de carte cadeau ou de crypto, même petite et même « urgente ».</li><li>Une demande de code reçu par SMS : ne le donnez jamais.</li><li>L’envie pressante de continuer sur une autre messagerie.</li><li>Un lien de « vérification » ou de paiement envoyé dans la conversation.</li></ul></details>

 <div class="list">${S.reports.length?S.reports.map(r=>`<div class="row"><span class="ric">${ic('flag',18)}</span><span class="grow"><b>${esc(P(r.id).prenom)} · ${esc(r.reason)}</b><small>Réf. ${r.ref} · ${esc(r.date)}</small></span><span class="status wait">${esc(r.status)}</span></div>`).join(''):`<p class="hint" style="padding:14px 16px">Aucun signalement envoyé. Vous pouvez signaler un profil depuis sa carte, son profil ou la conversation.</p>`}</div>
 <h2 class="sec-t">Personnes bloquées</h2>
 <div class="list">${S.blocked.length?S.blocked.map(id=>`<div class="row">${avatar(P(id),40)}<span class="grow"><b>${esc(P(id).prenom)}</b><small>Ne peut plus vous voir ni vous écrire</small></span><button class="btn ghost sm" data-a="unblock" data-id="${id}">Débloquer</button></div>`).join(''):`<p class="hint" style="padding:14px 16px">Personne n’est bloqué.</p>`}</div>
 <div class="list"><button class="row" data-a="toast" data-m="Formulaire de recours : réponse motivée sous 7 jours (délai à valider)."><span class="ric">${ic('help',20)}</span><span class="grow"><b>Contester une décision</b><small>Si votre compte ou un contenu a été restreint</small></span></button><button class="row" data-a="toast" data-m="Règles de la communauté : à finaliser avec l’équipe juridique."><span class="ric">${ic('doc',20)}</span><span class="grow"><b>Règles de la communauté</b><small>Ce qui est accepté, ce qui ne l’est pas</small></span></button></div>
 </div></div>`;

const SH={};
const shHead=(t,sub)=>`<div class="sheet-h"><h2 class="h2" id="sh-t">${t}</h2><button class="icon-btn" data-a="close" aria-label="Fermer">${ic('x')}</button></div>${sub?`<p class="lead" style="margin-top:-6px">${sub}</p>`:''}`;
SH.badge=()=>`${shHead('Que veut dire « Profil vérifié » ?')}<ul class="checks"><li>${ic('check',20)}<span>La <b>pièce d’identité</b> a été contrôlée par un prestataire spécialisé, et la personne a 18 ans ou plus.</span></li><li>${ic('check',20)}<span>Une <b>vidéo de présence</b> a confirmé qu’une personne réelle, correspondant aux photos, a créé le compte.</span></li></ul><ul class="checks no"><li>${ic('x',20)}<span>Cela <b>ne garantit pas</b> les intentions ni le comportement de la personne. Restez attentif ou attentive et signalez ce qui vous semble anormal.</span></li></ul><button class="btn primary" data-a="close">J’ai compris</button>`;
SH.filters=()=>{const f=S.filters;return `${shHead('Filtres')}
 <div class="box"><div class="range-row"><label for="r-fdist">Distance maximale</label><span id="o-fdist">${f.dist} km</span></div><input type="range" id="r-fdist" min="1" max="100" value="${f.dist}" data-bind="filters.dist" data-out="o-fdist" data-fmt="km"></div>
 <div class="box"><span class="lbl">Âge</span><div class="two"><div class="field"><label for="f-amin">De</label><input class="input" type="number" id="f-amin" min="18" max="99" value="${f.ageMin}" data-bind="filters.ageMin"></div><div class="field"><label for="f-amax">À</label><input class="input" type="number" id="f-amax" min="18" max="99" value="${f.ageMax}" data-bind="filters.ageMax"></div></div></div>
 <div class="field"><span class="flabel">Recherche</span>${chipsSel(['Toutes',...INTENTIONS],'filters.intention',false)}</div>
 <div class="field"><label for="f-int">Un centre d’intérêt en commun</label><select id="f-int" data-bind="filters.interest"><option value="">Peu importe</option>${INTERESTS.map(i=>`<option ${f.interest===i?'selected':''}>${i}</option>`).join('')}</select></div>
 <p class="hint">Nous ne filtrons jamais selon l’origine, la religion ou d’autres caractéristiques sensibles.</p>
 <div class="two"><button class="btn ghost" data-a="resetFilters">Réinitialiser</button><button class="btn primary" data-a="close">Appliquer</button></div>`};
SH.cardMenu=s=>{const p=P(s.id);return `${shHead(esc(p.prenom))}<div class="menu">${s.from==='profile'?'':`<button data-a="openProfile" data-id="${p.id}" data-ctx="deck">${ic('user',20)} Voir le profil complet</button>`}<button data-a="report" data-id="${p.id}">${ic('flag',20)} Signaler ${esc(p.prenom)}</button><button class="danger" data-a="sheet" data-k="block" data-id="${p.id}">${ic('ban',20)} Bloquer ${esc(p.prenom)}</button></div><button class="btn ghost" data-a="close">Annuler</button>`};
SH.chatMenu=s=>{const p=P(s.id);return `${shHead('Conversation avec '+esc(p.prenom))}<div class="menu"><button data-a="openProfile" data-id="${p.id}" data-ctx="chat">${ic('user',20)} Voir le profil</button><button data-a="report" data-id="${p.id}">${ic('flag',20)} Signaler</button><button data-a="sheet" data-k="block" data-id="${p.id}">${ic('ban',20)} Bloquer</button><button class="danger" data-a="unmatch" data-id="${p.id}">${ic('trash',20)} Supprimer la conversation</button></div><button class="btn ghost" data-a="close">Annuler</button>`};
SH.block=s=>{const p=P(s.id);return `${shHead('Bloquer '+esc(p.prenom)+' ?')}<ul class="checks"><li>${ic('check',20)}Vous ne verrez plus son profil, et ${esc(p.prenom)} ne verra plus le vôtre.</li><li>${ic('check',20)}${esc(p.prenom)} ne pourra plus vous écrire. La conversation disparaît.</li><li>${ic('check',20)}${esc(p.prenom)} n’est pas prévenu${p.id==='camille'||p.id==='monique'||p.id==='aicha'||p.id==='lea'||p.id==='ines'||p.id==='nadia'?'e':''}.</li></ul><p class="hint">Si cette personne vous a mis mal à l’aise, vous pouvez aussi la signaler.</p><button class="btn danger" data-a="doBlock" data-id="${p.id}">${ic('ban',20)} Bloquer</button><button class="btn soft" data-a="report" data-id="${p.id}">Signaler et bloquer</button><button class="btn ghost" data-a="close">Annuler</button>`};
SH.report=()=>{const r=S.report,p=P(r.id);
 if(r.step===1)return `${shHead('Signaler '+esc(p.prenom))}<span class="stepper">Étape 1 sur 3 · Motif</span><div class="opts" role="radiogroup" aria-label="Motif du signalement">${REASONS.map(([t,d])=>`<button class="opt" role="radio" aria-checked="${r.reason===t}" data-a="repReason" data-v="${esc(t)}"><span class="radio"></span><span class="grow">${t}<small>${d}</small></span></button>`).join('')}</div><button class="btn primary" data-a="repNext" ${r.reason?'':'disabled'}>Continuer</button>`;

 ${j('jStart','Inscription','Du premier écran aux vérifications')}${j('jVerify','Vérifications','Pièce d’identité, puis vidéo')}${j('jLocked','Compte non vérifié','Découverte, likes et messages bloqués')}${j('jDiscover','Découvrir','Cartes, glissement, filtres, quotas')}${j('jMatch','Match','Intérêt réciproque')}${j('jChat','Messagerie','Alerte arnaque sur un message reçu')}${j('jSwap','Échange de réseaux','Snapchat, Instagram… avec accord mutuel')}${j('jNew','Nouvelle conversation de test','Un nouveau match vide à chaque clic')}${j('jReport','Signalement','En 3 étapes, avec blocage')}${j('jLikes','Likes reçus','Version gratuite et Premium')}${j('jSafety','Aide et sécurité','Urgences, conseils, blocages')}${j('jA11y','Accessibilité','Texte agrandi, contraste, boutons seuls')}${j('jConsole','Console de modération','Outil interne de l’équipe')}</div>

 ${tg('simFail','Simuler un échec à la 1re vérification')}${tg('premium','Abonnement Premium actif')}${tg('simRefuse','La personne refuse l’échange de réseaux')}
 <div class="p-row"><label for="p-ql">J’aime gratuits (au total)</label><input type="number" id="p-ql" min="1" max="50" value="${S.quota.likes}" data-bind="quota.likes"></div>
 <div class="p-row"><label for="p-qm">Messages gratuits (au total)</label><input type="number" id="p-qm" min="1" max="50" value="${S.quota.msgs}" data-bind="quota.msgs"></div>

 <button class="btn ghost sm" style="width:100%" data-a="reset">Réinitialiser tout le prototype</button>
 <details class="p-dec"><summary>Décisions à valider avant le développement</summary><ul>
 <li><b>Nom :</b> « Liane » est un nom de travail. Vérifier INPI, domaine et stores.</li>
 <li><b>Quotas gratuits :</b> décidé le 12 nov. 2026 : 5 J’aime et 5 messages au total depuis l’inscription, sans renouvellement ; ensuite abonnement Premium obligatoire.</li>
 <li><b>Prestataire</b> identité + présence vidéo : pays, documents, coût par contrôle.</li>
 <li><b>Biométrie :</b> base légale, durée de conservation, AIPD, avis DPO et juriste.</li>
 <li><b>Lancement :</b> France seule ? Une ville d’abord pour la densité de profils.</li>
 <li><b>Prix de l’abonnement Premium :</b> 9,99 € / mois proposé, à tester.</li>
 <li><b>Modération :</b> équipe interne ou prestataire, horaires, délais, recours.</li>
 <li><b>Technique :</b> React Native ou Flutter, backend hébergé dans l’UE.</li>
 <li><b>Messagerie MVP :</b> texte seul ; photos et appels vidéo ensuite.</li>
 <li><b>Échange de réseaux :</b> un pseudo ne peut jamais être écrit dans un message ; seule une demande d’autorisation part. Refus = aucune nouvelle demande possible de la part de celui qui a demandé. À décider : délai minimum avant de pouvoir le proposer (par exemple après 5 messages de chaque côté).</li>
 <li><b>Connexion Apple / Google :</b> retirée de ce prototype, à décider.</li></ul></details>
 <p class="p-kbd">Clavier dans Découvrir : ← Passer, → J’aime. Échap ferme un panneau.</p>`}

 ignoreRisk:d=>{S.ignored[S.chatId+':'+d.i]=true;S.ignored[S.chatId]=true;render();toast('Alerte masquée. Vous pouvez toujours signaler plus tard.')},
 openLink:d=>openSheet('link',{url:d.url}),
 report:d=>{S.report={id:d.id,step:d.reason?2:1,reason:d.reason||null,details:'',proof:null,block:true};S.sheet={k:'report'};render()},
 repReason:d=>{S.report.reason=d.v;render()},
 repNext:()=>{S.report.step=2;render()},
 repBack:()=>{S.report.step=1;render()},
 repSend:()=>{const r=S.report,p=P(r.id);r.ref='SIG-'+(1043+S.reports.length);r.step=3;S.reports.unshift({ref:r.ref,id:r.id,reason:r.reason,date:'Aujourd’hui, '+hhmm(),status:'En cours d’examen'});const c=S.convos[r.id]||[];const lastThem=[...c].reverse().find(m=>m.f==='them');
  const ex=S.console.cases.find(x=>x.uid===r.id&&x.statut!=='Résolu');if(ex){ex.source+=' + signalement utilisateur';ex.recu='à l’instant';ex.sev=Math.max(ex.sev,SEV[r.reason]||2)}else S.console.cases.unshift({id:'C-'+(2042+S.reports.length),sev:SEV[r.reason]||2,motif:r.reason,compte:`${p.prenom}, ${p.age} ans`,uid:r.id,source:'Signalement utilisateur (Alex)',score:.7,recu:'à l’instant',statut:'Nouveau',regle:'Signalement manuel',ev:r.details||(lastThem?'« '+lastThem.t+' »':'Aucun détail fourni.'),hist:'Aucun antécédent',inscrit:'oct. 2026'});
  if(r.block&&!S.blocked.includes(r.id))doBlock(r.id,true);S.sheet={k:'report'};render()},
 repDone:()=>{S.report=null;S.sheet=null;render()},
 doBlock:d=>doBlock(d.id),
 unblock:d=>{S.blocked=S.blocked.filter(x=>x!==d.id);S.seen=S.seen.filter(x=>x!==d.id);render();toast(`${P(d.id).prenom} est débloqué.`)},
 unmatch:d=>{S.matches=S.matches.filter(x=>x!==d.id);delete S.convos[d.id];if(!S.seen.includes(d.id))S.seen.push(d.id);S.sheet=null;S.stack=[];S.screen='tabs';S.tab='messages';render();toast('Conversation supprimée.')},
 paywall:d=>goPaywall(d.r),
 buyPage:()=>{S.premium=true;back();toast('Simulation : abonnement Premium activé, aucun paiement effectué. Vous pouvez continuer.')},
 plan:d=>{S.plan=d.v;render()},
 buy:()=>{S.premium=true;S.sheet=null;render();toast('Simulation : abonnement Premium activé, aucun paiement effectué.')},
 cancelSub:()=>{S.premium=false;render();toast('Abonnement résilié. Il reste actif jusqu’à la fin de la période payée.')},
 set:d=>nav('settings',{setKey:d.k}),
 goSafety:()=>nav('safety'),
 scale:d=>{S.settings.textScale=+d.v;render()},
 resetFilters:()=>{S.filters={ageMin:18,ageMax:75,dist:30,intention:'Toutes',interest:''};render()},
 deleteAccount:()=>{reset(true);toast('Votre compte a été supprimé.')},
 logout:()=>{const keep=S;reset(true);toast('Vous êtes déconnecté.')},
 resetQuota:()=>{S.likesUsed=0;S.msgsUsed=0;render()},
 /* panneau */
 jStart:()=>{reset();toPhone()},
 jVerify:()=>{reset(true);demoUser();S.screen='verify-intro';S.stack=[{screen:'about'}];render();toPhone()},
 jLocked:()=>{reset(true);demoUser();enterApp('decouvrir');toPhone()},
 jDiscover:()=>{ensureDemo();enterApp('decouvrir');toPhone()},
 jMatch:()=>{ensureDemo();const p=PEOPLE.find(x=>x.likesYou&&!S.matches.includes(x.id)&&!S.blocked.includes(x.id));enterApp('decouvrir');if(p){if(!S.seen.includes(p.id))S.seen.push(p.id);createMatch(p.id);render()}else toast('Tous les profils réciproques sont déjà matchés.');toPhone()},
 jChat:()=>{ensureDemo();if(S.blocked.includes('marc')){S.blocked=S.blocked.filter(x=>x!=='marc')}if(!S.matches.includes('marc')){S.matches.push('marc');S.convos.marc=initState().convos.marc}delete S.closed.marc;S.ignored={};S.tab='messages';S.stack=[{screen:'tabs',tab:'messages'}];S.screen='chat';S.chatId='marc';S.unread.marc=false;S.scrollBottom=true;render();toPhone()},
 jReport:()=>{A.jChat();S.report={id:'marc',step:1,reason:null,details:'',proof:null,block:true};S.sheet={k:'report'};render()},
 jLikes:()=>{ensureDemo();enterApp('likes');toPhone()},
 jSafety:()=>{ensureDemo();S.tab='profil';S.stack=[{screen:'tabs',tab:'profil'}];S.screen='safety';render();toPhone()},
 jA11y:()=>{ensureDemo();S.tab='profil';S.stack=[{screen:'tabs',tab:'profil'}];S.screen='settings';S.setKey='a11y';render();toPhone()},
 jConsole:()=>{S.mode='console';S.console.view='queue';S.console.selected=null;render()},
 /* console */
 toApp:()=>{S.mode='app';render()},
 conView:d=>{S.console.view=d.v;S.console.selected=null;render()},
 conFilter:d=>{S.console.filter=+d.v;render()},
 conOpen:d=>{S.console.view='queue';S.console.selected=d.id;S.tmp.dec='Classer sans suite';S.tmp.mot='Aucune infraction constatée';S.tmp.note='';const c=S.console.cases.find(x=>x.id===d.id);if(c.statut==='Nouveau')c.statut='En cours';audit('Consultation du dossier',d.id);render()},
 conBack:()=>{S.console.selected=null;render()},
 conEscalate:d=>{audit(S.console.role==='Support'?'Dossier transmis à la Modération':'Escalade au responsable sécurité',d.id);render();showConMsg('Dossier transmis. L’action est enregistrée dans le journal d’audit.')},
 conDecide:d=>{const c=S.console.cases.find(x=>x.id===d.id);const dec=S.tmp.dec||'Classer sans suite';c.statut='Résolu';c.decision=dec+' · '+(S.tmp.mot||'');audit('Décision : '+dec,c.id);
  if(c.uid&&ALL[c.uid]&&/Suspension|Bannissement/.test(dec)){const p=P(c.uid);S.closed[c.uid]=`Cette conversation est close : le compte de ${p.prenom} a été suspendu après examen. Merci pour votre vigilance.`;if(S.convos[c.uid])S.convos[c.uid].push({f:'sys',t:`Le compte de ${p.prenom} a été suspendu. Ne donnez suite à aucune demande reçue de sa part.`,h:hhmm()});S.reports.forEach(r=>{if(r.id===c.uid)r.status='Traité : compte suspendu'})}
  else S.reports.forEach(r=>{if(r.id===c.uid)r.status='Traité'});render()},
 conApproveMe:()=>{if(S.verif.id==='review'){S.verif.id='ok';S.verif.idDate=todayFR()}if(S.verif.video==='review'){S.verif.video='ok';S.verif.videoDate=todayFR()}audit('Vérification validée après examen humain',S.me.prenom||'Membre');render();showConMsg('Vérification validée. Retournez dans l’application pour voir le changement.')}
};
function showConMsg(m){const el=$con.querySelector('.con-main');if(el){const d=document.createElement('div');d.className='done';d.setAttribute('role','status');d.textContent=m;el.prepend(d)}}
function setErr(k,m){S.err={[k]:m};render();const f=$app.querySelector('.bad');if(f)f.focus()}
function reset(noSplash){clearTimers();S=initState();if(noSplash)S.screen='welcome';render();if(!noSplash)later(()=>{if(S.screen==='splash'){S.screen='welcome';render()}},1100)}

/* ---------------- Rendu ---------------- */
function render(){
 const ae=document.activeElement;const fid=ae&&ae.id&&ae!==document.body?ae.id:null;let sel=null;try{if(ae&&ae.setSelectionRange&&ae.type!=='number'&&ae.type!=='email')sel=[ae.selectionStart,ae.selectionEnd]}catch(e){}
 const scrolls={};document.querySelectorAll('[data-sk]').forEach(n=>scrolls[n.dataset.sk]=n.scrollTop);
 $app.className='app'+(S.settings.contrast?' hc':'')+(S.settings.reduceMotion?' rm':'');
 $app.style.setProperty('--scale',S.settings.textScale);
 $phone.hidden=S.mode!=='app';$con.hidden=S.mode!=='console';
 if(S.mode==='app'){const f=SCR[S.screen];$app.innerHTML=(f?f():'')+(S.match?matchHTML():'')+(S.sheet?`<div class="backdrop" data-a="closeBackdrop"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"><div class="grab" aria-hidden="true"></div>${(SH[S.sheet.k]||(()=>''))(S.sheet)}</div></div>`:'')+`<div class="toast-wrap" role="status" aria-live="polite">${S.toast?`<div class="toast">${esc(S.toast)}</div>`:''}</div>`}
 else $con.innerHTML=consoleHTML();
 $panel.innerHTML=panelHTML();
 document.querySelectorAll('[data-sk]').forEach(n=>{if(scrolls[n.dataset.sk]!=null)n.scrollTop=scrolls[n.dataset.sk]});
 if(S.scrollBottom){const m=$app.querySelector('.msgs');if(m)m.scrollTop=m.scrollHeight;S.scrollBottom=false}
 if(fid){const n=document.getElementById(fid);if(n&&!(S.sheet&&!n.closest('.sheet')&&n.closest('#app'))){n.focus({preventScroll:true});if(sel&&n.setSelectionRange)try{n.setSelectionRange(sel[0],sel[1])}catch(e){}}}
 if(S.focusSel){const n=$app.querySelector(S.focusSel);if(n)n.focus({preventScroll:true});S.focusSel=null}
 bindDeck();
}

/* ---------------- Glissement des cartes ---------------- */
const drag={suppress:false};
function bindDeck(){const card=$app.querySelector('.card.top');if(!card||S.settings.noSwipe||S.sheet||S.match)return;let sx=0,sy=0,dx=0,active=false,captured=false;
 card.addEventListener('pointerdown',e=>{if(e.button>0||e.target.closest('.card-more,.vb-float,.see'))return;active=true;captured=false;sx=e.clientX;sy=e.clientY;dx=0;drag.suppress=false});
 card.addEventListener('pointermove',e=>{if(!active)return;dx=e.clientX-sx;const dy=e.clientY-sy;if(!captured&&Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){captured=true;drag.suppress=true;try{card.setPointerCapture(e.pointerId)}catch(_){}card.style.transition='none'}if(!captured)return;card.style.transform=`translate(${dx}px,${dy*.15}px) rotate(${dx/18}deg)`;card.querySelector('.stamp.like').style.opacity=Math.max(0,Math.min(1,dx/90));card.querySelector('.stamp.pass').style.opacity=Math.max(0,Math.min(1,-dx/90))});
 const end=()=>{if(!active)return;active=false;if(!captured)return;card.style.transition='';if(dx>110)decide('like');else if(dx<-110)decide('pass');else resetTopCard()};
 card.addEventListener('pointerup',end);card.addEventListener('pointercancel',end)}

/* ---------------- Événements ---------------- */
document.addEventListener('click',e=>{
 if(drag.suppress&&e.target.closest('.card')){drag.suppress=false;e.preventDefault();return}
 const el=e.target.closest('[data-a]');if(!el)return;
 if(el.dataset.a==='closeBackdrop'){if(e.target===el)closeSheet();return}
 const fn=A[el.dataset.a];if(!fn)return;e.preventDefault();fn(el.dataset,el,e)});
const LIVE={
 bio:el=>{const c=document.getElementById('bio-count');if(c)c.textContent=el.value.length+' / 300';const w=document.getElementById('bio-warn');if(w)w.hidden=!personal(el.value)},
 city:el=>{const box=document.getElementById('city-sug');if(!box)return;const q=el.value.toLowerCase();box.innerHTML=CITIES.filter(c=>!q||c.toLowerCase().includes(q)).slice(0,5).map(c=>`<button class="row" data-a="setCity" data-v="${esc(c)}">${ic('pin',18)}<span class="grow"><b>${esc(c)}</b></span></button>`).join('')}
};
document.addEventListener('input',e=>{const el=e.target,k=el.dataset&&el.dataset.bind;if(!k)return;let v=el.value;if(el.type==='number'||el.type==='range'){v=Number(v);if(isNaN(v))return}setPath(S,k,v);
 if(el.dataset.out){const o=document.getElementById(el.dataset.out);if(o)o.textContent=v+(el.dataset.fmt==='km'?' km':'')}
 if(el.dataset.live&&LIVE[el.dataset.live])LIVE[el.dataset.live](el)});
document.addEventListener('change',e=>{const el=e.target;
 if(el.id==='file-photo'&&el.files&&el.files[0]){const fr=new FileReader();fr.onload=()=>{if(S.me.photos.length<6){S.me.photos.push({src:fr.result});S.err={};render();toast('Photo ajoutée. Analyse automatique : conforme.')}};fr.readAsDataURL(el.files[0]);return}
 if(el.id==='file-proof'&&el.files&&el.files[0]){S.report.proof=el.files[0].name;render();return}
 if(el.dataset&&el.dataset.rerender)render();
 if(el.type==='number'&&el.dataset.bind){const lo=+el.min||1,hi=+el.max||99;let v=Math.max(lo,Math.min(hi,Number(el.value)||lo));setPath(S,el.dataset.bind,v);if(el.dataset.bind==='filters.ageMin'&&S.filters.ageMax<v)S.filters.ageMax=v;if(el.dataset.bind==='filters.ageMax'&&S.filters.ageMin>v)S.filters.ageMin=v;render()}
 if(el.type==='range'||el.tagName==='SELECT')render()});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(S.sheet){closeSheet();return}if(S.match){S.match=null;render();return}}
 if(e.key==='Enter'&&e.target.id==='f-msg'){e.preventDefault();A.send();return}
 if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('clk')){A.conOpen({id:e.target.dataset.id});return}
 const tag=(e.target.tagName||'').toLowerCase();if(['input','textarea','select'].includes(tag))return;
 if(S.mode==='app'&&S.screen==='tabs'&&S.tab==='decouvrir'&&!S.sheet&&!S.match&&isVerified()){if(e.key==='ArrowLeft'){e.preventDefault();decide('pass')}if(e.key==='ArrowRight'){e.preventDefault();decide('like')}}});

try{document.documentElement.lang='fr'}catch(e){}
reset();
})();
</script>
</body>
</html>
