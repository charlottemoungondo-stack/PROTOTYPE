<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#54243F">
<meta name="robots" content="noindex">
<style>[hidden]{display:none!important}html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>Prototype Liane</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout : panneau de pilotage du prototype à gauche, téléphone (ou console de modération) à droite. Palette « Romance moderne ». */
:root{
  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --page:#F4E7E5; --app:#FFF5F2; --surface:#FFFFFF; --surface-2:#FBE8E4; --surface-3:#F6DCD6;
  --ink:#2A1520; --ink-2:#6B5260; --line:#EEDAD6; --line-strong:#D6BAB5; --title:#54243F;
  --primary:#C83268; --on-primary:#FFFFFF; --primary-text:#A82A58; --primary-soft:#FBE1EA;
  --deep:#54243F; --on-deep:#FFF5F2; --peach:#F5C6A9; --on-peach:#3B1A2C; --rose:#EFA3B9;
  --trust:#318779; --trust-text:#1F6B5E; --trust-soft:#DCEFEA;
  --warn-text:#8A4B00; --warn-soft:#FFF1DC; --warn-line:#F0C68A;
  --danger:#B3261E; --on-danger:#FFFFFF; --danger-text:#A3221B; --danger-soft:#FCE4E2;
  --scrim:rgba(42,12,28,.5); --match:#54243F; --on-match:#FFF5F2;
  --shadow:0 18px 50px rgba(84,36,63,.18); --shadow-sm:0 4px 14px rgba(84,36,63,.12);
  --frame:#2A1520; --focus:#C83268;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#110A0E; --app:#1B0F16; --surface:#26151F; --surface-2:#311C29; --surface-3:#3C2332;
    --ink:#FBEFF2; --ink-2:#CDB3C0; --line:#3E2735; --line-strong:#5E4252; --title:#F7C9D8;
    --primary:#E5588C; --on-primary:#22070F; --primary-text:#F493B6; --primary-soft:#4A1C30;
    --deep:#6A2E50; --on-deep:#FFF5F2; --peach:#F5C6A9; --on-peach:#3B1A2C; --rose:#EFA3B9;
    --trust:#4FB5A0; --trust-text:#86D6C4; --trust-soft:#173832;
    --warn-text:#F4C27A; --warn-soft:#3A2810; --warn-line:#7A5520;
    --danger:#F07A72; --on-danger:#2A0806; --danger-text:#FF9C94; --danger-soft:#3E1714;
    --scrim:rgba(0,0,0,.62); --match:#3A1729; --on-match:#FFF5F2;
    --shadow:0 18px 50px rgba(0,0,0,.55); --shadow-sm:0 4px 14px rgba(0,0,0,.4);
    --frame:#000000; --focus:#F493B6; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#110A0E; --app:#1B0F16; --surface:#26151F; --surface-2:#311C29; --surface-3:#3C2332;
  --ink:#FBEFF2; --ink-2:#CDB3C0; --line:#3E2735; --line-strong:#5E4252; --title:#F7C9D8;
  --primary:#E5588C; --on-primary:#22070F; --primary-text:#F493B6; --primary-soft:#4A1C30;
  --deep:#6A2E50; --on-deep:#FFF5F2; --peach:#F5C6A9; --on-peach:#3B1A2C; --rose:#EFA3B9;
  --trust:#4FB5A0; --trust-text:#86D6C4; --trust-soft:#173832;
  --warn-text:#F4C27A; --warn-soft:#3A2810; --warn-line:#7A5520;
  --danger:#F07A72; --on-danger:#2A0806; --danger-text:#FF9C94; --danger-soft:#3E1714;
  --scrim:rgba(0,0,0,.62); --match:#3A1729; --on-match:#FFF5F2;
  --shadow:0 18px 50px rgba(0,0,0,.55); --shadow-sm:0 4px 14px rgba(0,0,0,.4);
  --frame:#000000; --focus:#F493B6; color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.page{max-width:1280px;margin:0 auto;padding-block:24px;display:grid;grid-template-columns:minmax(260px,320px) minmax(0,1fr);gap:32px;align-items:start}
.stage{display:flex;justify-content:center;min-width:0}
.phone{position:relative;width:392px;max-width:100%;height:min(844px,calc(100dvh - 48px));min-height:620px;border-radius:46px;border:10px solid var(--frame);background:var(--app);box-shadow:var(--shadow);overflow:hidden}

/* ---------- Panneau de pilotage ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;position:sticky;top:24px;max-height:calc(100dvh - 48px);overflow:auto;display:flex;flex-direction:column;gap:14px}
.p-brand{display:flex;align-items:center;gap:12px;color:var(--primary)}
.p-name{font-family:var(--font-display);font-weight:800;font-size:28px;line-height:1;color:var(--title);letter-spacing:-.02em}
.p-ver{font-size:12px;color:var(--ink-2);margin-top:4px;letter-spacing:.02em}
.p-intro{margin:0;font-size:13.5px;line-height:1.5;color:var(--ink-2)}
.p-h{margin:6px 0 0;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
.jumps{display:flex;flex-direction:column;gap:2px}
.jump{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;background:none;border:0;border-radius:12px;padding:9px 10px;color:var(--ink)}
.jump:hover{background:var(--surface-2)}
.jump b{display:block;font-size:14px;font-weight:600}
.jump small{display:block;font-size:12px;color:var(--ink-2);margin-top:1px}
.jump .ic{color:var(--ink-2);flex:none}
.p-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13.5px}
.p-row input[type=number]{width:64px;padding:6px 8px;border-radius:10px;border:1.5px solid var(--line-strong);background:var(--surface);text-align:center;font-variant-numeric:tabular-nums}
.p-dec{border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13px;background:var(--surface-2)}
.p-dec summary{cursor:pointer;font-weight:600}
.p-dec ul{margin:10px 0 2px;padding-left:18px;line-height:1.5;color:var(--ink-2)}
.p-dec li+li{margin-top:6px}
.p-dec b{color:var(--ink)}
.p-kbd{font-size:12px;color:var(--ink-2);margin:0}
.btn.sm{min-height:38px;font-size:13.5px;width:auto;padding:0 14px}

/* ---------- App ---------- */
.app{position:absolute;inset:0;display:flex;flex-direction:column;font-size:calc(15px * var(--scale,1));background:var(--app);color:var(--ink);line-height:1.4;overflow:hidden}
.app.hc{--ink-2:var(--ink);--line:var(--line-strong)}
.app.rm *,.app.rm *::before,.app.rm *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion: reduce){.app *,.app *::before,.app *::after{animation:none!important;transition:none!important}}
.screen{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.scroll{flex:1;overflow-y:auto;min-height:0;padding:4px 20px 20px;display:flex;flex-direction:column;gap:16px}
.topbar{display:flex;align-items:center;gap:8px;padding:12px 12px 6px;min-height:58px}
.tb-title{flex:1;text-align:center;font-weight:700;font-size:1.02em;margin:0}
.sp{width:44px;flex:none}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--ink);flex:none}
.icon-btn:hover{background:var(--surface-2)}
.bottom-actions{padding:12px 20px 20px;display:flex;flex-direction:column;gap:10px;background:var(--app)}
.h1{font-family:var(--font-display);font-size:1.85em;line-height:1.12;font-weight:700;color:var(--title);margin:0;letter-spacing:-.015em;text-wrap:balance}
.h2{font-family:var(--font-display);font-size:1.3em;line-height:1.2;font-weight:700;color:var(--title);margin:0;text-wrap:balance}
.h3{font-size:1.02em;font-weight:700;margin:0;color:var(--ink)}
.lead{margin:0;color:var(--ink-2);line-height:1.5}
.fine{margin:0;font-size:.8em;color:var(--ink-2);text-align:center;line-height:1.45}
.inline-link{background:none;border:0;padding:0;color:var(--primary-text);text-decoration:underline;font-weight:600}
.lbl{font-size:.74em;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink-2)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:3.25em;padding:0 1.3em;border-radius:999px;font-weight:700;font-size:1em;border:1.5px solid transparent;width:100%;text-align:center;line-height:1.15}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.deep{background:var(--deep);color:var(--on-deep)}
.btn.ghost{background:transparent;border-color:var(--line-strong);color:var(--ink)}
.btn.soft{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--danger);color:var(--on-danger)}
.btn.peach{background:var(--peach);color:var(--on-peach)}
.btn.link{background:none;color:var(--primary-text);min-height:2.8em;text-decoration:underline;text-underline-offset:3px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.flabel{font-weight:600;font-size:.93em}
.hint{font-size:.85em;color:var(--ink-2);line-height:1.45;margin:0}
.input,.field select,.field textarea{width:100%;min-height:3.15em;border-radius:14px;border:1.5px solid var(--line-strong);background:var(--surface);padding:.6em 1em;font-size:1em}
.field textarea{min-height:7em;resize:vertical;line-height:1.45}
.input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px var(--primary-soft)}
.input.bad{border-color:var(--danger)}
.err{display:flex;gap:6px;align-items:flex-start;color:var(--danger-text);font-size:.88em;font-weight:600;margin:0}
.err .ic{flex:none;margin-top:1px}
.otp{font-size:1.6em;letter-spacing:.5em;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}

.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:999px;padding:4px}
.seg button{border:0;background:transparent;border-radius:999px;min-height:2.8em;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.seg3{grid-template-columns:repeat(3,1fr)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:.5em .9em;border-radius:999px;background:var(--surface-2);font-size:.9em;font-weight:500;border:1.5px solid transparent;color:var(--ink);min-height:2.6em}
button.chip:hover{border-color:var(--line-strong)}
.chip[aria-pressed=true]{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-text);font-weight:600}
.chip.common{background:var(--trust-soft);color:var(--trust-text)}

.prog{display:flex;align-items:center;gap:12px;padding:0 20px 6px}
.prog-bar{flex:1;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.prog-bar span{display:block;height:100%;background:var(--primary);border-radius:3px}
.prog-t{font-size:.8em;color:var(--ink-2);font-weight:600;font-variant-numeric:tabular-nums}

.note{background:var(--surface-2);border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.note p{margin:4px 0 0;color:var(--ink-2);font-size:.92em;line-height:1.45}
.note .ic{flex:none;color:var(--primary-text);margin-top:2px}
.note.trust{background:var(--trust-soft)}.note.trust .ic{color:var(--trust-text)}
.note.warn{background:var(--warn-soft);border:1.5px solid var(--warn-line)}.note.warn .ic{color:var(--warn-text)}
.note.danger{background:var(--danger-soft)}.note.danger .ic{color:var(--danger-text)}

.vbadge{display:inline-flex;align-items:center;gap:5px;background:var(--trust-soft);color:var(--trust-text);font-weight:700;font-size:.8em;padding:.35em .75em;border-radius:999px;border:0}
.vicon{display:inline-grid;place-items:center;color:var(--trust);vertical-align:-2px}
.status{display:inline-flex;align-items:center;gap:5px;font-size:.8em;font-weight:700;padding:.32em .7em;border-radius:999px;white-space:nowrap}
.status.ok{background:var(--trust-soft);color:var(--trust-text)}
.status.todo{background:var(--surface-3);color:var(--ink-2)}
.status.wait{background:var(--warn-soft);color:var(--warn-text)}
.status.ko{background:var(--danger-soft);color:var(--danger-text)}

.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.steps li{display:flex;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.steps p{margin:4px 0 0;color:var(--ink-2);font-size:.92em;line-height:1.45}
.step-ic{width:46px;height:46px;border-radius:14px;background:var(--trust-soft);color:var(--trust-text);display:grid;place-items:center;flex:none}
.step-ic.peach{background:var(--peach);color:var(--on-peach)}

.vcard{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.vcard .grow{flex:1;min-width:0}
.vcard b{display:block}
.vcard small{color:var(--ink-2);font-size:.85em}

/* Splash & accueil */
.splash{align-items:center;justify-content:center;background:var(--deep);color:var(--rose)}
.splash-in{display:flex;flex-direction:column;align-items:center;gap:10px;animation:pop .6s ease}
.wordmark{font-family:var(--font-display);font-weight:800;letter-spacing:-.03em}
.wordmark.big{font-size:2.6em;color:var(--on-deep)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.welcome .hero{flex:1;min-height:0;background:var(--deep);color:var(--on-deep);border-radius:0 0 36px 36px;display:flex;flex-direction:column;padding:18px 22px 26px;gap:14px;position:relative;overflow:hidden}
.brandrow{display:flex;align-items:center;gap:8px;color:var(--rose)}
.brandrow .wordmark{font-size:1.5em;color:var(--on-deep)}
.hero-art{flex:1;min-height:140px;position:relative}
.tile{position:absolute;border-radius:22px;overflow:hidden;border:4px solid rgba(255,245,242,.9);box-shadow:0 12px 30px rgba(0,0,0,.25)}
.tile svg{display:block;width:100%;height:100%}
.t1{width:42%;height:78%;left:4%;top:12%;transform:rotate(-7deg)}
.t2{width:44%;height:86%;left:30%;top:0;z-index:2}
.t3{width:38%;height:70%;right:2%;top:18%;transform:rotate(8deg)}
.hero-badge{position:absolute;z-index:3;left:50%;bottom:-4px;transform:translateX(-50%);background:var(--trust-soft);color:var(--trust-text);font-weight:700;font-size:.8em;padding:.5em .9em;border-radius:999px;display:flex;gap:6px;align-items:center;white-space:nowrap;box-shadow:var(--shadow-sm)}
.hero h1{font-family:var(--font-display);font-size:2em;line-height:1.08;margin:0;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.hero p{margin:0;opacity:.88;line-height:1.45}

/* Illustrations */
.ill{width:84px;height:84px;border-radius:26px;display:grid;place-items:center;background:var(--trust-soft);color:var(--trust-text);margin:6px auto 0}
.ill.peach{background:var(--peach);color:var(--on-peach)}
.ill.warn{background:var(--warn-soft);color:var(--warn-text)}
.ill.rose{background:var(--primary-soft);color:var(--primary-text)}
.center{text-align:center}
.center .h1,.center .lead{text-align:center}
.checks{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.checks li{display:flex;gap:10px;align-items:flex-start;line-height:1.4}
.checks .ic{flex:none;color:var(--trust);margin-top:1px}
.checks.no .ic{color:var(--danger-text)}

/* Photos */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot{position:relative;aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:var(--surface-2);border:2px dashed var(--line-strong);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink-2);font-size:.8em;font-weight:600;max-width:100%}
.slot.filled{border:0}
.slot img,.slot svg.pt{width:100%;height:100%;object-fit:cover;display:block}
label.slot{cursor:pointer}
label.slot:hover{border-color:var(--primary)}
.slot .rm{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(20,8,14,.7);color:#fff;display:grid;place-items:center}
.slot .main{position:absolute;left:6px;bottom:6px;background:var(--primary);color:var(--on-primary);font-size:.78em;font-weight:700;padding:.2em .6em;border-radius:999px}
.slot .mk{position:absolute;inset:0;border:0;background:transparent}
.pt{display:block;width:100%;height:100%}

/* App chrome */
.apphead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px 6px;min-height:58px}
.ah-title{font-family:var(--font-display);font-size:1.6em;font-weight:700;color:var(--title);margin:0 0 0 6px}
.hbtn{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:0 .85em;min-height:2.75em;font-weight:600;font-size:.85em;color:var(--ink)}
.hbtn:hover{border-color:var(--line-strong)}
.wm{display:flex;align-items:center;gap:5px;color:var(--primary)}
.wm span{font-family:var(--font-display);font-weight:800;font-size:1.45em;color:var(--title);letter-spacing:-.03em}
.tabbody{flex:1;min-height:0;display:flex;flex-direction:column}
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding:4px 4px 8px}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.76em;font-weight:600;color:var(--ink-2);min-height:3.6em;justify-content:center;position:relative;border-radius:12px}
.tabbar button[aria-current=page]{color:var(--primary-text)}
.tabbar button[aria-current=page] .ic{fill:currentColor}
.tabbar .dot{position:absolute;top:6px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--primary);color:var(--on-primary);font-size:.72em;display:grid;place-items:center;padding:0 5px;font-weight:700}

/* Découvrir */
.deckwrap{flex:1;min-height:0;display:flex;flex-direction:column}
.deck{position:relative;flex:1;min-height:0;margin:2px 14px 0}
.card{position:absolute;inset:0;border-radius:26px;overflow:hidden;background:var(--surface-2);box-shadow:var(--shadow-sm);touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .25s ease}
.card.behind{transform:scale(.95) translateY(12px);opacity:.8}
.card .photo{position:absolute;inset:0}
.card .photo img{width:100%;height:100%;object-fit:cover}
.bars{position:absolute;top:10px;left:14px;right:14px;display:flex;gap:5px;z-index:3}
.bars span{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.45)}
.bars span.on{background:#fff}
.tap{position:absolute;top:0;bottom:45%;width:45%;z-index:2;border:0;background:transparent}
.tap.l{left:0}.tap.r{right:0}
.vb-float{position:absolute;top:24px;left:14px;z-index:4;display:flex;align-items:center;gap:5px;border:0;border-radius:999px;background:rgba(255,255,255,.94);color:#1F6B5E;font-weight:700;font-size:.8em;padding:.45em .8em;min-height:2.4em}
.card-more{position:absolute;top:20px;right:12px;z-index:4;width:44px;height:44px;border-radius:50%;border:0;background:rgba(20,8,14,.45);color:#fff;display:grid;place-items:center}
.shade{position:absolute;left:0;right:0;bottom:0;height:62%;background:linear-gradient(to bottom,rgba(30,8,20,0),rgba(30,8,20,.86));z-index:1;pointer-events:none}
.meta{position:absolute;left:18px;right:18px;bottom:16px;z-index:3;color:#fff;display:flex;flex-direction:column;gap:6px}
.meta .name{font-family:var(--font-display);font-size:1.95em;font-weight:700;line-height:1.05;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.meta .pron{font-family:var(--font-body);font-size:.45em;font-weight:600;background:rgba(255,255,255,.2);padding:.2em .6em;border-radius:999px}
.meta .sub{display:flex;align-items:center;gap:5px;font-size:.9em;opacity:.95}
.meta .intent{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.9em}
.meta .tags{display:flex;gap:6px;flex-wrap:wrap}
.meta .tags span{background:rgba(255,255,255,.2);backdrop-filter:blur(4px);padding:.3em .7em;border-radius:999px;font-size:.8em;font-weight:600}
.see{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;margin-top:2px;background:#fff;color:#2A1520;border:0;border-radius:999px;font-weight:700;font-size:.85em;padding:0 .9em;min-height:2.6em}
.stamp{position:absolute;top:70px;z-index:5;font-family:var(--font-display);font-weight:800;font-size:1.6em;padding:.15em .5em;border-radius:10px;border:4px solid;opacity:0;text-transform:uppercase;letter-spacing:.04em;pointer-events:none}
.stamp.like{left:22px;color:#fff;border-color:#fff;background:rgba(200,50,104,.85);transform:rotate(-12deg)}
.stamp.pass{right:22px;color:#fff;border-color:#fff;background:rgba(42,21,32,.75);transform:rotate(12deg)}
.actions{display:flex;justify-content:center;align-items:flex-end;gap:16px;padding:12px 10px 2px}
.act{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.78em;font-weight:700;color:var(--ink-2);background:none;border:0;padding:0;border-radius:16px}
.act .circle{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow-sm);border:1.5px solid var(--line);color:var(--ink);transition:transform .15s}
.act:hover .circle{transform:scale(1.05)}
.act.like .circle{background:var(--primary);color:var(--on-primary);width:70px;height:70px;border:0}
.act.small .circle{width:48px;height:48px}
.act.like{color:var(--primary-text)}
.quota{margin:6px 0 8px;text-align:center;font-size:.8em;color:var(--ink-2);font-variant-numeric:tabular-nums}

.locked{flex:1;overflow-y:auto;padding:18px 22px 22px;display:flex;flex-direction:column;gap:14px;text-align:center}
.locked .vcard{text-align:left}

/* Profil détaillé */
.pv-photo{position:relative;height:56%;min-height:300px;flex:none;margin:0 -20px}
.pv-photo .photo{position:absolute;inset:0}
.pv-photo .photo img{width:100%;height:100%;object-fit:cover}
.pv-photo .ovb{position:absolute;top:12px;z-index:4;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#2A1520;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.pv-photo .ovb.l{left:14px}.pv-photo .ovb.r{right:14px}
.pv-photo .bars{top:auto;bottom:34px}
.pv-body{background:var(--app);border-radius:26px 26px 0 0;margin:-26px -20px 0;padding:22px 20px 8px;position:relative;z-index:2;display:flex;flex-direction:column;gap:16px}
.pv-name{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pv-sub{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:.92em;margin-top:-8px;flex-wrap:wrap}
.box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.box p{margin:0;line-height:1.5}
.box .big{font-weight:700;font-size:1.05em;display:flex;align-items:center;gap:8px}
.vline{display:flex;align-items:center;gap:10px;font-weight:600}
.vline .ic{color:var(--trust);flex:none}
.safe-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pv-actions{display:flex;justify-content:center;gap:28px;padding:10px 0 14px;background:var(--app);border-top:1px solid var(--line)}
.preview-banner{background:var(--trust-soft);color:var(--trust-text);font-weight:600;font-size:.88em;padding:10px 16px;display:flex;gap:8px;align-items:center}

/* Likes */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lcard{position:relative;aspect-ratio:3/4;border-radius:18px;overflow:hidden;border:0;padding:0;background:var(--surface-2);max-width:100%;text-align:left}
.lcard .photo{position:absolute;inset:0}
.lcard.blur .photo{filter:blur(14px) saturate(1.1);transform:scale(1.15)}
.lcard .cap{position:absolute;left:10px;right:10px;bottom:10px;color:#fff;font-weight:700;z-index:2;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.lcard .shade{height:45%}
.upsell{background:var(--deep);color:var(--on-deep);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:10px}
.upsell p{margin:0;opacity:.9;line-height:1.45;font-size:.92em}
.upsell .btn.peach{margin-top:4px}

/* Listes */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:12px 16px;border:0;border-bottom:1px solid var(--line);min-height:3.8em;width:100%;background:none;text-align:left;color:inherit}
.list>.row:last-child{border-bottom:0}
button.row:hover{background:var(--surface-2)}
.row .grow{flex:1;min-width:0}
.row .grow b{display:block;font-weight:600}
.row .grow small{display:block;color:var(--ink-2);font-size:.85em;line-height:1.35;margin-top:2px}
.row .ric{width:38px;height:38px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--primary-text);flex:none}
.row .chev{color:var(--ink-2);flex:none}
.row.danger b,.row.danger .ric{color:var(--danger-text)}
.sec-t{margin:6px 4px -6px;font-size:.78em;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink-2)}

.switch{position:relative;width:52px;height:32px;border-radius:16px;border:0;background:var(--line-strong);flex:none;padding:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked=true]{background:var(--trust)}
.switch[aria-checked=true]::after{transform:translateX(20px)}
.switch[disabled]{opacity:.6}

/* Messages */
.newmatches{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 8px}
.nm{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;font-weight:600;font-size:.85em;color:var(--ink);flex:none}
.av{display:block;border-radius:50%;overflow:hidden;flex:none;background:var(--surface-2)}
.av img,.av svg{width:100%;height:100%;object-fit:cover;display:block}
.nm .av{outline:3px solid var(--primary);outline-offset:2px}
.conv .prev{display:block;color:var(--ink-2);font-size:.88em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.conv .prev.unread{color:var(--ink);font-weight:600}
.conv .meta2{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:.78em;color:var(--ink-2);flex:none}
.udot{width:10px;height:10px;border-radius:50%;background:var(--primary)}
.flag{display:inline-flex;align-items:center;gap:4px;font-size:.78em;font-weight:700;color:var(--warn-text);background:var(--warn-soft);padding:.15em .55em;border-radius:999px;margin-top:4px}

.chathead{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 6px;border-bottom:1px solid var(--line);background:var(--surface)}
.chathead .who{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;padding:4px;border-radius:12px}
.chathead .who b{display:flex;align-items:center;gap:5px}
.chathead .who small{color:var(--ink-2);font-size:.8em}
.safestrip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 16px;background:var(--surface-2);font-size:.84em;color:var(--ink-2)}
.safestrip .ic{color:var(--primary-text)}
.safestrip button{border:0;background:var(--surface);border-radius:999px;padding:.3em .8em;font-weight:700;font-size:.95em;display:inline-flex;gap:4px;align-items:center;min-height:2.3em}
.safestrip .grow{flex:1;min-width:8em}
.msgs{flex:1;overflow-y:auto;min-height:0;padding:14px 14px 10px;display:flex;flex-direction:column;gap:8px}
.sys{align-self:center;text-align:center;font-size:.8em;color:var(--ink-2);max-width:88%;background:var(--surface-2);padding:.6em 1em;border-radius:14px;line-height:1.45}
.b{max-width:80%;padding:.6em .9em;border-radius:18px;line-height:1.42;overflow-wrap:anywhere}
.b.them{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:6px}
.b.me{background:var(--deep);color:var(--on-deep);align-self:flex-end;border-bottom-right-radius:6px}
.b .t{font-size:.72em;opacity:.7;margin-top:3px;text-align:right;font-variant-numeric:tabular-nums}
.b.risky{border:2px solid var(--warn-line)}
.msg-link{background:none;border:0;padding:0;color:inherit;text-decoration:underline;font-weight:700}
.riskcard{align-self:stretch;background:var(--warn-soft);border:1.5px solid var(--warn-line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.riskcard .rt{display:flex;gap:8px;align-items:flex-start;font-weight:700;color:var(--warn-text)}
.riskcard p{margin:0;font-size:.9em;line-height:1.45}
.riskcard .ra{display:flex;gap:8px;flex-wrap:wrap}
.riskcard .ra button{border:0;border-radius:999px;padding:0 .9em;min-height:2.5em;font-weight:700;font-size:.86em;background:var(--surface);color:var(--ink)}
.riskcard .ra button.go{background:var(--danger);color:var(--on-danger)}
.typing{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:.6em .9em;font-size:.85em;color:var(--ink-2)}
.composer{display:flex;align-items:center;gap:8px;padding:10px 12px 12px;border-top:1px solid var(--line);background:var(--surface)}
.composer .input{border-radius:999px;min-height:2.9em}
.send{width:46px;height:46px;border-radius:50%;border:0;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;flex:none}
.swapc{max-width:88%;border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1.5px solid var(--line-strong)}
.swapc.them{align-self:flex-start;border-color:var(--rose)}
.swapc.me{align-self:flex-end;border-style:dashed}
.swapc.done{align-self:stretch;max-width:none;background:var(--trust-soft);border-color:transparent}
.sw-h{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--title);line-height:1.3}
.swapc.done .sw-h{color:var(--trust-text)}
.sw-h .ic{flex:none}
.sw-f{margin:0;font-size:.84em;color:var(--ink-2);line-height:1.45}
.sw-acts{display:flex;gap:8px;flex-wrap:wrap}
.sw-row{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:8px 10px}
.sw-row .grow{flex:1;min-width:0}
.sw-row b{display:block;font-size:.92em}
.sw-row small{display:block;color:var(--ink-2);font-size:.86em;overflow-wrap:anywhere}
.sw-b{display:inline-flex;align-items:center;gap:3px;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:999px;padding:0 .9em;min-height:2.5em;font-weight:700;font-size:.85em;text-decoration:none;white-space:nowrap}
.sw-b.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.swapc.refused{border-style:solid;border-color:var(--line-strong);background:var(--surface-2)}
.swap-btn[disabled]{border-color:var(--line-strong);background:var(--surface-2);color:var(--ink-2);cursor:not-allowed}
.sochip{display:flex;gap:6px;flex-wrap:wrap;margin-top:-2px}
.sochip.me{align-self:flex-end;justify-content:flex-end}
.sochip.them{align-self:flex-start}
.swapbar{display:flex;align-items:center;gap:10px;padding:8px 12px 0;background:var(--surface);border-top:1px solid var(--line)}
.swapbar .hint{font-size:.76em;min-width:0}
.swap-btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--primary);background:var(--primary-soft);color:var(--primary-text);border-radius:999px;padding:0 .9em;min-height:2.6em;font-weight:700;font-size:.85em;white-space:nowrap;flex:none}
.swapbar+.composer{border-top:0}
.quota-lock{padding:14px 16px 16px;border-top:1px solid var(--line);background:var(--primary-soft);display:flex;flex-direction:column;gap:8px}
.quota-lock .ql-h{display:flex;gap:8px;align-items:center;font-weight:700;color:var(--primary-text)}
.quota-lock p{margin:0;font-size:.88em;line-height:1.45;color:var(--ink)}
.act.like.locked .circle{background:var(--surface-3);color:var(--ink-2)}
.pw .pw-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-top:4px}
.pw .pw-hero .h1,.pw .pw-hero .lead{text-align:center}
.pw-ic{width:76px;height:76px;border-radius:24px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary-text)}
.closed{padding:14px 16px;background:var(--surface-2);font-size:.9em;color:var(--ink-2);text-align:center;line-height:1.45;border-top:1px solid var(--line)}
.qline{text-align:center;font-size:.78em;color:var(--ink-2);padding:6px 0 0;background:var(--surface)}

/* Caméra simulée */
.cam{background:#140A10;color:#FFF5F2}
.cam .topbar .icon-btn{color:#FFF5F2}
.cam .topbar .icon-btn:hover{background:rgba(255,255,255,.1)}
.cam .tb-title{color:#FFF5F2}
.camview{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:10px 22px 22px;text-align:center}
.camframe{position:relative;width:100%;max-width:300px;aspect-ratio:1.58;border-radius:18px;border:3px solid rgba(255,245,242,.85);display:grid;place-items:center;overflow:hidden;background:#24151D}
.scanline{position:absolute;left:6%;right:6%;height:3px;background:#4FB5A0;box-shadow:0 0 14px #4FB5A0;animation:scan 2s ease-in-out infinite alternate}
@keyframes scan{from{top:8%}to{top:90%}}
.camtip{font-size:.92em;line-height:1.45;opacity:.85;max-width:300px;margin:0}
.shutter{width:76px;height:76px;border-radius:50%;border:5px solid #FFF5F2;background:#C83268;display:grid;place-items:center;color:#fff}
.shutter-l{font-weight:700;font-size:.9em}
.ovalwrap{position:relative;width:230px;height:290px;max-width:100%}
.oval{position:absolute;inset:14px;border-radius:50%;overflow:hidden;background:#24151D}
.oval .face{width:100%;height:100%;transition:transform .6s ease}
.ring{position:absolute;inset:0;width:100%;height:100%}
.rec{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);padding:.35em .8em;border-radius:999px;font-size:.82em;font-weight:600}
.rec i{width:9px;height:9px;border-radius:50%;background:#FF5A5F;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.instr{font-family:var(--font-display);font-size:1.45em;font-weight:700;line-height:1.2;min-height:2.4em;margin:0;text-wrap:balance}
.simnote{font-size:.78em;opacity:.7;margin:0}
.spinner{width:56px;height:56px;border-radius:50%;border:5px solid var(--surface-3);border-top-color:var(--primary);animation:spin 1s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* Match */
.match{position:absolute;inset:0;z-index:35;background:var(--match);color:var(--on-match);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:28px 24px;text-align:center;animation:fadein .3s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.match h2{font-family:var(--font-display);font-size:2.3em;line-height:1.05;margin:0;font-weight:800;letter-spacing:-.02em}
.match p{margin:0;opacity:.9;line-height:1.45}
.duo{position:relative;width:250px;height:200px;max-width:100%}
.duo .ph{position:absolute;width:130px;height:170px;border-radius:22px;overflow:hidden;border:4px solid #FFF5F2;box-shadow:0 12px 28px rgba(0,0,0,.3)}
.duo .ph img{width:100%;height:100%;object-fit:cover}
.duo .a{left:6px;top:10px;transform:rotate(-8deg)}
.duo .z{right:6px;top:0;transform:rotate(7deg)}
.duo .hrt{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:#C83268;color:#fff;display:grid;place-items:center;border:4px solid #FFF5F2;z-index:2;animation:beat 1.2s ease infinite}
@keyframes beat{50%{transform:translate(-50%,-50%) scale(1.1)}}
.match .btn{max-width:320px}
.match .btn.ghost{border-color:rgba(255,245,242,.6);color:#FFF5F2}
.match .tip{font-size:.82em;opacity:.8;display:flex;gap:6px;align-items:center}

/* Feuilles */
.backdrop{position:absolute;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;animation:fadein .2s ease}
.sheet{background:var(--app);width:100%;border-radius:26px 26px 0 0;max-height:90%;overflow-y:auto;padding:8px 20px 22px;display:flex;flex-direction:column;gap:14px;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line-strong);margin:4px auto 0;flex:none}
.sheet-h{display:flex;align-items:flex-start;gap:10px}
.sheet-h .h2{flex:1}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;min-height:3.3em;font-weight:600}
.opt[aria-checked=true]{border-color:var(--primary);background:var(--primary-soft)}
.opt .radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-strong);flex:none;display:grid;place-items:center}
.opt[aria-checked=true] .radio{border-color:var(--primary)}
.opt[aria-checked=true] .radio::after{content:"";width:11px;height:11px;border-radius:50%;background:var(--primary)}
.opt .grow{flex:1}
.opt small{display:block;font-weight:500;color:var(--ink-2);font-size:.85em}
.opt .price{font-weight:700;font-variant-numeric:tabular-nums}
.opts{display:flex;flex-direction:column;gap:8px}
.menu{display:flex;flex-direction:column;gap:6px}
.menu button{display:flex;align-items:center;gap:12px;border:0;background:var(--surface);border-radius:14px;padding:0 14px;min-height:3.3em;font-weight:600;text-align:left}
.menu button.danger{color:var(--danger-text)}
.stepper{font-size:.8em;font-weight:700;color:var(--ink-2);letter-spacing:.04em}
.checkline{display:flex;gap:12px;align-items:flex-start;background:none;border:0;text-align:left;padding:6px 0;width:100%}
.box-ck{width:24px;height:24px;border-radius:7px;border:2px solid var(--line-strong);flex:none;display:grid;place-items:center;color:var(--on-primary);margin-top:1px}
.checkline[aria-checked=true] .box-ck{background:var(--primary);border-color:var(--primary)}
.range-row{display:flex;justify-content:space-between;font-weight:600;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--primary);min-height:32px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.perks{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.perks li{display:flex;gap:10px;align-items:center}
.perks .ic{color:var(--primary-text);flex:none}
.cmp{width:100%;border-collapse:collapse;font-size:.9em}
.cmp th,.cmp td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
.cmp th{font-size:.8em;color:var(--ink-2);letter-spacing:.05em;text-transform:uppercase}
.cmp td:not(:first-child),.cmp th:not(:first-child){text-align:center;width:28%}

.toast-wrap{position:absolute;left:14px;right:14px;bottom:86px;z-index:60;pointer-events:none;display:flex;justify-content:center}
.toast{background:var(--ink);color:var(--app);border-radius:14px;padding:12px 16px;font-weight:600;font-size:.9em;box-shadow:var(--shadow);animation:up .25s ease;line-height:1.4}

.compl{display:flex;flex-direction:column;gap:8px}
.compl .prog-bar{height:8px}
.mehead{display:flex;gap:16px;align-items:center}
.mehead .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.mehead .nm2{font-family:var(--font-display);font-size:1.45em;font-weight:700;color:var(--title);line-height:1.1}
.urgent{background:var(--danger-soft);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px}
.urgent b{color:var(--danger-text)}
.urgent p{margin:0;line-height:1.5;font-size:.93em}
.num{font-family:var(--font-display);font-weight:800;font-size:1.25em;color:var(--danger-text);font-variant-numeric:tabular-nums}
.tips{margin:0;padding-left:1.2em;line-height:1.5;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
details.acc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:0 16px}
details.acc summary{cursor:pointer;font-weight:700;padding:14px 0;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.acc summary::-webkit-details-marker{display:none}
details.acc[open] summary .ic{transform:rotate(90deg)}

function topbar(o={}){return `<div class="topbar">${o.back===false?'<span class="sp"></span>':`<button class="icon-btn" data-a="back" aria-label="Retour">${ic('back')}</button>`}${o.title?`<h1 class="tb-title">${o.title}</h1>`:'<div class="tb-title"></div>'}${o.right||'<span class="sp"></span>'}</div>`}
function progress(n){return `<div class="prog" role="progressbar" aria-valuemin="1" aria-valuemax="5" aria-valuenow="${n}" aria-label="Inscription, étape ${n} sur 5"><div class="prog-bar"><span style="width:${n*20}%"></span></div><span class="prog-t">Étape ${n} sur 5</span></div>`}
function errL(k){return S.err[k]?`<p class="err" id="err-${k}" role="alert">${ic('warn',16)}<span>${esc(S.err[k])}</span></p>`:''}
function sw(k,label,desc,opts={}){const v=!!getPath(S,k);return `<div class="row"><div class="grow"><b id="lb-${k.replace(/\./g,'-')}">${label}</b>${desc?`<small>${desc}</small>`:''}</div><button class="switch" role="switch" aria-checked="${opts.force!=null?opts.force:v}" aria-labelledby="lb-${k.replace(/\./g,'-')}" ${opts.disabled?'disabled':`data-a="toggle" data-k="${k}"`}></button></div>`}
function chipsSel(list,key,multi,max){const cur=getPath(S,key);return `<div class="chips">${list.map(x=>{const on=multi?cur.includes(x):cur===x;return `<button class="chip" aria-pressed="${on}" data-a="pick" data-k="${key}" data-v="${esc(x)}" data-m="${multi?1:0}" ${max?`data-max="${max}"`:''}>${on&&multi?ic('check',15):''}${esc(x)}</button>`}).join('')}</div>`}
function bottom(btns){return `<div class="bottom-actions">${btns}</div>`}

/* ---------------- Écrans : accueil et inscription ---------------- */
const SCR={};
SCR.splash=()=>`<div class="screen splash"><div class="splash-in">${LOGO(78)}<div class="wordmark big">liane</div></div></div>`;
SCR.welcome=()=>`<div class="screen welcome"><div class="hero">
  <div class="brandrow">${LOGO(30)}<span class="wordmark">liane</span></div>
  <div class="hero-art" aria-hidden="true"><div class="tile t1">${portrait(ALL.camille.look,0)}</div><div class="tile t2">${portrait(ALL.thomas.look,1)}</div><div class="tile t3">${portrait(ALL.monique.look,2)}</div><div class="hero-badge">${ic('shieldcheck',16)} Tous les profils sont vérifiés</div></div>
  <h1>Des rencontres vraies, en confiance.</h1>
  <p>Chaque membre vérifie son identité et sa présence réelle avant de pouvoir écrire à quelqu’un.</p></div>
  ${bottom(`<button class="btn primary" data-a="go" data-s="how">Créer mon compte</button><button class="btn ghost" data-a="demoLogin">J’ai déjà un compte</button><p class="fine">En continuant, vous acceptez nos <button class="inline-link" data-a="toast" data-m="Conditions d’utilisation : à rédiger avec un juriste avant lancement.">Conditions d’utilisation</button> et notre <button class="inline-link" data-a="toast" data-m="Politique de confidentialité : à rédiger avec le DPO avant lancement.">Politique de confidentialité</button>.</p>`)}</div>`;
SCR.how=()=>`<div class="screen">${topbar()}<div class="scroll">
  <h1 class="h1">Ici, tout le monde est vérifié</h1>
  <p class="lead">Avant de découvrir des profils, chaque membre passe deux contrôles gratuits. Comptez environ 3 minutes.</p>
  <ol class="steps"><li><span class="step-ic">${ic('id',24)}</span><div><b>Votre pièce d’identité</b><p>Un prestataire spécialisé vérifie qu’elle est authentique et que vous avez 18 ans ou plus. Elle n’est jamais montrée aux autres membres.</p></div></li>
  <li><span class="step-ic peach">${ic('video',24)}</span><div><b>Une courte vidéo de vous</b><p>Quelques secondes face à la caméra pour confirmer que vous êtes une personne réelle, et la personne de vos photos. La vidéo est supprimée après le contrôle.</p></div></li></ol>
  <div class="note">${ic('info')}<div><b>Ce que la vérification ne garantit pas</b><p>Elle confirme qu’une personne est réelle. Elle ne dit rien de ses intentions : restez attentif ou attentive, comme partout.</p></div></div>
  </div>${bottom(`<button class="btn primary" data-a="go" data-s="auth">J’ai compris, continuer</button>`)}</div>`;
SCR.auth=()=>{const t=S.me.contactType==='tel';return `<div class="screen">${topbar()}<div class="scroll">
  <h1 class="h1">Créons votre compte</h1>
  <div class="seg" role="group" aria-label="Moyen de connexion"><button aria-pressed="${t}" data-a="ctype" data-v="tel">Téléphone</button><button aria-pressed="${!t}" data-a="ctype" data-v="mail">E-mail</button></div>
  <div class="field"><label for="f-contact">${t?'Numéro de mobile':'Adresse e-mail'}</label>
  <input class="input ${S.err.contact?'bad':''}" id="f-contact" type="${t?'tel':'email'}" inputmode="${t?'tel':'email'}" autocomplete="${t?'tel':'email'}" placeholder="${t?'06 12 34 56 78':'prenom@exemple.fr'}" value="${esc(S.me.contact)}" data-bind="me.contact" ${S.err.contact?'aria-describedby="err-contact" aria-invalid="true"':''}>
  ${errL('contact')}<p class="hint">Nous vous envoyons un code à usage unique. ${t?'Votre numéro':'Votre adresse'} n’est jamais affiché${t?'':'e'} sur votre profil.</p></div>
  </div>${bottom(`<button class="btn primary" data-a="sendCode">Recevoir mon code</button>`)}</div>`};
SCR.otp=()=>{const c=S.me.contact.trim();const m=S.me.contactType==='tel'?'•• •• •• •• '+c.replace(/\s/g,'').slice(-2):c.replace(/^(.).*(@.*)$/,'$1•••$2');return `<div class="screen">${topbar()}<div class="scroll">
  <h1 class="h1">Entrez le code reçu</h1><p class="lead">Envoyé à ${esc(m)}. Il est valable 10 minutes.</p>
  <div class="field"><label for="f-otp">Code à 6 chiffres</label><input class="input otp ${S.err.otp?'bad':''}" id="f-otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" value="${esc(S.tmp.otp||'')}" data-bind="tmp.otp" ${S.err.otp?'aria-describedby="err-otp" aria-invalid="true"':''}>${errL('otp')}</div>
  <div class="note">${ic('info')}<div><b>Prototype</b><p>N’importe quel code à 6 chiffres fonctionne.</p></div></div>
  <button class="btn link" data-a="toast" data-m="Nouveau code envoyé.">Renvoyer le code</button>
  </div>${bottom(`<button class="btn primary" data-a="checkOtp">Valider</button>`)}</div>`};
SCR.dob=()=>{const max=new Date().toISOString().slice(0,10);return `<div class="screen">${topbar()}${progress(1)}<div class="scroll">
  <h1 class="h1">Votre date de naissance</h1><p class="lead">Liane est réservée aux personnes majeures. Seul votre âge sera visible, jamais votre date de naissance.</p>
  <div class="field"><label for="f-dob">Date de naissance</label><input class="input ${S.err.dob?'bad':''}" id="f-dob" type="date" max="${max}" min="1920-01-01" value="${esc(S.me.dob)}" data-bind="me.dob" ${S.err.dob?'aria-describedby="err-dob" aria-invalid="true"':''}>${errL('dob')}</div>
  <div class="note trust">${ic('lock')}<div><b>Contrôlée lors de la vérification d’identité</b><p>Votre âge est confirmé par votre pièce d’identité à la fin de l’inscription.</p></div></div>
  </div>${bottom(`<button class="btn primary" data-a="saveDob">Continuer</button>`)}</div>`};
SCR.minor=()=>`<div class="screen">${topbar({back:false})}<div class="scroll center"><div class="ill warn">${ic('info',38)}</div>
  <h1 class="h1">Liane est réservée aux adultes</h1><p class="lead">Vous devez avoir 18 ans ou plus pour créer un compte. Nous n’avons conservé aucune des informations saisies.</p>
  <p class="hint">Vous avez fait une erreur de saisie ? Recommencez l’inscription depuis le début.</p></div>${bottom(`<button class="btn primary" data-a="reset">Revenir à l’accueil</button>`)}</div>`;
SCR.basics=()=>`<div class="screen">${topbar()}${progress(2)}<div class="scroll">
  <h1 class="h1">Comment vous présenter ?</h1>
  <div class="field"><label for="f-prenom">Prénom d’usage</label><input class="input ${S.err.prenom?'bad':''}" id="f-prenom" autocomplete="given-name" maxlength="30" value="${esc(S.me.prenom)}" data-bind="me.prenom" ${S.err.prenom?'aria-describedby="err-prenom" aria-invalid="true"':''}>${errL('prenom')}<p class="hint">C’est le seul nom affiché. Pas besoin de votre nom de famille.</p></div>
  <div class="field"><span class="flabel" id="lb-genre">Je suis</span>${chipsSel(['Une femme','Un homme','Une personne non binaire','Je préfère le décrire'],'me.genre',false)}${S.me.genre==='Je préfère le décrire'?`<input class="input" id="f-genre" aria-labelledby="lb-genre" placeholder="Comment vous décrivez-vous ?" value="${esc(S.me.genreLibre)}" data-bind="me.genreLibre">`:''}${errL('genre')}</div>
  <div class="field"><label for="f-pron">Pronoms <span class="hint">(facultatif)</span></label><input class="input" id="f-pron" placeholder="elle, il, iel…" maxlength="20" value="${esc(S.me.pronoms)}" data-bind="me.pronoms"></div>
  <div class="field"><span class="flabel">Je souhaite rencontrer</span>${chipsSel(['Des femmes','Des hommes','Des personnes non binaires'],'me.cherche',true)}${errL('cherche')}</div>
  <div class="field"><label for="f-ori">Orientation <span class="hint">(facultatif)</span></label><select id="f-ori" data-bind="me.orientation"><option value="">Je préfère ne pas le dire</option>${['Hétérosexuelle','Homosexuelle','Bisexuelle','Pansexuelle','Asexuelle','En questionnement'].map(o=>`<option ${S.me.orientation===o?'selected':''}>${o}</option>`).join('')}</select><p class="hint">Jamais affichée sans votre accord. Vous pourrez la montrer ou la masquer dans Confidentialité.</p></div>
  </div>${bottom(`<button class="btn primary" data-a="saveBasics">Continuer</button>`)}</div>`;
SCR.location=()=>{const q=(S.tmp.city||'').toLowerCase();const sug=S.tmp.cityInput?CITIES.filter(c=>!q||c.toLowerCase().includes(q)).slice(0,5):[];return `<div class="screen">${topbar()}${progress(3)}<div class="scroll">
  <div class="ill rose">${ic('pin',38)}</div>
  <h1 class="h1">Où souhaitez-vous faire des rencontres ?</h1>
  <p class="lead">Nous utilisons votre position pour vous proposer des personnes proches. Les autres voient seulement une distance arrondie, comme « à environ 5 km », jamais votre adresse.</p>
  ${S.me.ville?`<div class="vcard">${ic('checkc',24)}<div class="grow"><b>${esc(S.me.ville)}</b><small>Position approximative, arrondie au kilomètre</small></div><button class="btn link" style="width:auto" data-a="clearCity">Modifier</button></div>`:`
  <button class="btn deep" data-a="useLoc">${ic('pin',20)} Utiliser ma position</button>
  <button class="btn ghost" data-a="cityInput">Saisir ma ville</button>
  ${S.tmp.cityInput?`<div class="field"><label for="f-city">Ville ou arrondissement</label><input class="input" id="f-city" autocomplete="off" placeholder="Ex. Lyon 3e" value="${esc(S.tmp.city||'')}" data-bind="tmp.city" data-live="city"><div class="list" id="city-sug">${sug.map(c=>`<button class="row" data-a="setCity" data-v="${esc(c)}">${ic('pin',18)}<span class="grow"><b>${esc(c)}</b></span></button>`).join('')}</div></div>`:''}`}
  ${errL('ville')}</div>${bottom(`<button class="btn primary" data-a="saveLoc">Continuer</button>`)}</div>`};
SCR.photos=()=>{const ph=S.me.photos;const slots=[];for(let i=0;i<6;i++){const p=ph[i];slots.push(p?`<div class="slot filled">${photoHTML(p,'Votre photo '+(i+1))}${i>0?`<button class="mk" data-a="photoMain" data-i="${i}" aria-label="Utiliser la photo ${i+1} comme photo principale"></button>`:''}${i===0?'<span class="main">Principale</span>':''}<button class="rm" data-a="photoRm" data-i="${i}" aria-label="Retirer la photo ${i+1}">${ic('x',16)}</button></div>`:i===ph.length?`<label class="slot" for="file-photo">${ic('plus',26)}<span>Ajouter</span></label>`:`<div class="slot" aria-hidden="true"></div>`)}
 return `<div class="screen">${topbar()}${S.editing?'':progress(4)}<div class="scroll">
  <h1 class="h1">Vos photos</h1><p class="lead">Ajoutez au moins 2 photos, jusqu’à 6. La première est votre photo principale ; touchez une autre photo pour la mettre en premier.</p>
  <input type="file" id="file-photo" accept="image/*" class="vh">
  <div class="pgrid">${slots.join('')}</div>${errL('photos')}
  <button class="btn soft" data-a="photoEx">${ic('image',20)} Ajouter une photo d’exemple</button>
  <div class="note">${ic('camera')}<div><b>Pour de bonnes photos</b><p>Votre visage bien visible, seul ou seule sur la photo principale, des photos récentes. Chaque photo est analysée automatiquement pour écarter les contenus interdits.</p></div></div>
  </div>${bottom(`<button class="btn primary" data-a="savePhotos">${S.editing?'Enregistrer':'Continuer'}</button>`)}</div>`};
SCR.about=()=>{const n=S.me.bio.length;const w=personal(S.me.bio);return `<div class="screen">${topbar()}${S.editing?'':progress(5)}<div class="scroll">
  <h1 class="h1">Parlez un peu de vous</h1>
  <div class="field"><label for="f-bio">Votre présentation <span class="hint">(facultatif)</span></label><textarea id="f-bio" maxlength="300" placeholder="Ce que vous aimez, ce qui vous fait rire, ce que vous cherchez…" data-bind="me.bio" data-live="bio" aria-describedby="bio-count">${esc(S.me.bio)}</textarea><p class="hint" id="bio-count">${n} / 300</p>
  <p class="err" id="bio-warn" ${w?'':'hidden'}>${ic('warn',16)}<span>Évitez d’indiquer un numéro, un e-mail ou un pseudo de réseau social : c’est une demande fréquente des arnaqueurs.</span></p></div>
  <div class="field"><span class="flabel">Je recherche</span>${chipsSel(INTENTIONS,'me.intention',false)}${errL('intention')}</div>
  <div class="field"><span class="flabel">Centres d’intérêt <span class="hint">(3 à 5, ${S.me.interests.length} choisi${S.me.interests.length>1?'s':''})</span></span>${chipsSel(INTERESTS,'me.interests',true,5)}${errL('interests')}</div>
  </div>${bottom(`<button class="btn primary" data-a="saveAbout">${S.editing?'Enregistrer':'Continuer vers les vérifications'}</button>`)}</div>`};

/* ---------------- Vérifications ---------------- */
function verifCards(){return `<div class="vcard"><span class="step-ic">${ic('id',24)}</span><div class="grow"><b>Pièce d’identité</b><small>${S.verif.id==='ok'?'Vérifiée le '+S.verif.idDate:'Environ 1 minute'}</small></div>${statusPill(S.verif.id)}</div>
 <div class="vcard"><span class="step-ic peach">${ic('video',24)}</span><div class="grow"><b>Vidéo de présence</b><small>${S.verif.video==='ok'?'Vérifiée le '+S.verif.videoDate:'Environ 10 secondes'}</small></div>${statusPill(S.verif.video)}</div>`}
function nextVerifBtn(){if(S.verif.id!=='ok'&&S.verif.id!=='review')return `<button class="btn primary" data-a="go" data-s="id-choose">${ic('id',20)} Vérifier ma pièce d’identité</button>`;if(S.verif.video!=='ok'&&S.verif.video!=='review')return `<button class="btn primary" data-a="go" data-s="video-intro">${ic('video',20)} Faire la vidéo</button>`;if(isVerified())return `<button class="btn primary" data-a="go" data-s="verified">Continuer</button>`;return `<button class="btn primary" disabled>En attente de l’examen</button>`}
SCR['verify-intro']=()=>`<div class="screen">${topbar()}<div class="scroll">
  <h1 class="h1">Dernière étape : vos vérifications</h1><p class="lead">Ces deux contrôles sont gratuits et obligatoires pour tout le monde.</p>
  ${verifCards()}
  <div class="note warn">${ic('lock')}<div><b>Tant qu’ils ne sont pas validés</b><p>Votre profil n’est proposé à personne et vous ne pouvez ni aimer ni écrire. Vous pouvez quand même compléter votre profil.</p></div></div>
  </div>${bottom(`${nextVerifBtn()}${isVerified()?'':`<button class="btn link" data-a="later">Faire plus tard</button>`}`)}</div>`;
SCR['id-choose']=()=>{const d=S.tmp.doc||'cni';const o=(k,t,s)=>`<button class="opt" role="radio" aria-checked="${d===k}" data-a="setTmp" data-k="doc" data-v="${k}"><span class="radio"></span><span class="grow">${t}<small>${s}</small></span>${ic('id',22)}</button>`;return `<div class="screen">${topbar()}<div class="scroll">
  <h1 class="h1">Quelle pièce allez-vous utiliser ?</h1>
  <div class="opts" role="radiogroup" aria-label="Type de pièce">${o('cni','Carte nationale d’identité','Recto et verso')}${o('pass','Passeport','Page avec la photo')}${o('sejour','Titre de séjour','Recto et verso')}</div>
  <p class="hint">Pièces françaises acceptées pour le lancement. La liste des pays dépendra du prestataire retenu.</p>
  <div class="note trust">${ic('lock')}<div><b>Ce que nous conservons</b><p>Le contrôle est réalisé par un prestataire spécialisé. Liane conserve uniquement le résultat (validé ou non), la date et une référence. Pas de copie de votre pièce.</p></div></div>
  <button class="btn link" data-a="sheet" data-k="altverif">Je ne peux pas utiliser l’appareil photo</button>
  </div>${bottom(`<button class="btn primary" data-a="startScan">${ic('camera',20)} Scanner ma pièce</button>`)}</div>`};
function idCardArt(){return `<svg viewBox="0 0 316 200" width="86%" aria-hidden="true"><rect x="4" y="4" width="308" height="192" rx="16" fill="#F3E7E2"/><rect x="4" y="4" width="308" height="34" rx="16" fill="#C9E4DC"/><rect x="4" y="26" width="308" height="12" fill="#C9E4DC"/><rect x="22" y="56" width="86" height="112" rx="10" fill="#E2CFC8"/><circle cx="65" cy="98" r="22" fill="#C99A7E"/><path d="M30 168c4-28 20-40 35-40s31 12 35 40z" fill="#8A5A6E"/><g fill="#BFA9A2"><rect x="128" y="62" width="150" height="12" rx="6"/><rect x="128" y="88" width="120" height="10" rx="5"/><rect x="128" y="110" width="140" height="10" rx="5"/><rect x="128" y="132" width="90" height="10" rx="5"/></g><rect x="128" y="154" width="160" height="16" rx="4" fill="#D9C6C0"/></svg>`}
SCR['id-scan']=()=>{const side=S.tmp.side||'recto';const lbl=S.tmp.doc==='pass'?'Page avec la photo':side==='recto'?'Recto':'Verso';return `<div class="screen cam">${topbar({title:lbl})}<div class="camview">
  <div class="camframe">${idCardArt()}<div class="scanline"></div></div>
  <p class="camtip">Posez la pièce à plat, sans reflet, avec les quatre coins visibles dans le cadre.</p>
  <button class="shutter" data-a="idShot" aria-label="Prendre la photo">${ic('camera',30)}</button><span class="shutter-l">Prendre la photo</span>
  <p class="simnote">Simulation : la caméra n’est pas utilisée dans ce prototype.</p></div></div>`};
SCR.processing=()=>`<div class="screen"><div class="scroll center" style="justify-content:center"><div class="spinner" role="img" aria-label="Chargement"></div><h1 class="h2" role="status">${esc(S.tmp.procTitle||'Vérification en cours…')}</h1><p class="lead">Cela prend généralement moins d’une minute. Vous pouvez rester sur cet écran.</p></div></div>`;
SCR['id-result']=()=>S.verif.id==='ok'?`<div class="screen">${topbar({back:false})}<div class="scroll center"><div class="ill">${ic('shieldcheck',40)}</div>
  <h1 class="h1">Pièce d’identité vérifiée</h1><p class="lead">C’est fait. Nous avons conservé uniquement le résultat et la date (${S.verif.idDate}).</p>
  <div class="vcard" style="text-align:left"><span class="step-ic peach">${ic('video',24)}</span><div class="grow"><b>Prochaine étape : la vidéo</b><small>Environ 10 secondes</small></div></div></div>
  ${bottom(`<button class="btn primary" data-a="go" data-s="video-intro">Continuer : la vidéo</button>`)}</div>`
 :`<div class="screen">${topbar({back:false})}<div class="scroll"><div class="ill warn">${ic('warn',38)}</div>
  <h1 class="h1 center">Nous n’avons pas pu lire votre pièce</h1><p class="lead center">Le texte est flou ou un reflet cache une partie des informations. Ce n’est pas un refus définitif.</p>
  <ul class="checks"><li>${ic('check',20)}Placez-vous près d’une fenêtre, sans flash</li><li>${ic('check',20)}Posez la pièce sur une surface sombre et unie</li><li>${ic('check',20)}Vérifiez que la pièce n’est pas expirée</li></ul>
  <div class="note">${ic('help')}<div><b>Ça ne fonctionne toujours pas ?</b><p>Une personne de l’équipe vérification peut examiner votre dossier. Réponse sous 48 h.</p></div></div></div>
  ${bottom(`<button class="btn primary" data-a="startScan">Réessayer</button><button class="btn ghost" data-a="askReview" data-k="id">Demander un examen par une personne</button>`)}</div>`;
SCR['video-intro']=()=>`<div class="screen">${topbar()}<div class="scroll">
  <div class="ill peach">${ic('video',38)}</div>
  <h1 class="h1 center">Vérification vidéo</h1><p class="lead center">Une courte séquence d’environ 10 secondes pour confirmer que vous êtes bien là, et que vous êtes la personne de vos photos.</p>
  <ul class="checks"><li>${ic('checkc',20)}Placez-vous dans un endroit bien éclairé</li><li>${ic('checkc',20)}Retirez lunettes de soleil, casquette ou masque</li><li>${ic('checkc',20)}Suivez les indications à l’écran</li></ul>
  <div class="note trust">${ic('lock')}<div><b>Votre vidéo n’est pas conservée</b><p>Elle sert uniquement à ce contrôle et elle est supprimée dès le résultat obtenu. Seul le résultat est gardé.</p></div></div>
  <button class="btn link" data-a="sheet" data-k="altverif">Je ne peux pas utiliser la caméra</button>
  </div>${bottom(`<button class="btn primary" data-a="startVideo">Démarrer la vidéo</button>`)}</div>`;
const VSTEPS=['Regardez l’écran','Tournez lentement la tête vers la gauche','Puis vers la droite','Souriez !'];
SCR['video-capture']=()=>{const st=S.tmp.vstep||0;const pct=Math.min(1,(st+1)/VSTEPS.length);const C=2*Math.PI*108;const rot=st===1?'rotateY(-22deg) translateX(-8px)':st===2?'rotateY(22deg) translateX(8px)':'none';const me=S.me.photos[0];const face=me&&me.src?`<img class="face" src="${me.src}" alt="" style="object-fit:cover">`:`<div class="face" style="transform:${rot}">${portrait(me?me.look:DEMO_LOOK,1)}</div>`;
 return `<div class="screen cam">${topbar({title:'Vérification vidéo'})}<div class="camview">
  <span class="rec"><i></i> Enregistrement</span>

 :`<div class="screen">${topbar({back:false})}<div class="scroll"><div class="ill warn">${ic('warn',38)}</div>
  <h1 class="h1 center">La vidéo n’a pas abouti</h1><p class="lead center">Votre visage n’était pas assez éclairé pour terminer le contrôle. Vous pouvez réessayer tout de suite.</p>

SCR.verified=()=>`<div class="screen">${topbar({back:false})}<div class="scroll">
  <div class="ill">${ic('shieldcheck',42)}</div>
