<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Clé LoveCove</title>
<style>body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#54243F;color:#fff;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}main{max-width:420px;width:100%;text-align:center}code{display:block;background:#fff;color:#2B1422;border-radius:14px;padding:16px;font-size:17px;word-break:break-all;margin:18px 0;user-select:all;-webkit-user-select:all}button{width:100%;border:0;border-radius:999px;padding:16px;font-size:17px;font-weight:700;background:#F2994A;color:#2B1422}p{opacity:.85;line-height:1.4}</style></head>
<body><main><h1>Clé d’accès de test</h1><p>Appuyez sur « Copier », puis collez la clé dans LoveCove.</p><code id="k"></code><button id="b">Copier la clé</button><p id="m"></p></main>
<script>var k=decodeURIComponent(location.hash.slice(1));document.getElementById('k').textContent=k||'(aucune clé dans le lien)';document.getElementById('b').onclick=function(){var d=function(){document.getElementById('m').textContent='Clé copiée ✓ Revenez dans LoveCove et collez-la.'};if(navigator.clipboard)navigator.clipboard.writeText(k).then(d,function(){document.getElementById('m').textContent='Sélectionnez la clé (appui long) puis « Copier ».'});else document.getElementById('m').textContent='Sélectionnez la clé (appui long) puis « Copier ».'};</script></body></html>
